<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stats Settings</title>
  <link rel="stylesheet" href="/static/settings/shell.css">
</head>
<body>
  <div id="settingsLockOverlay" aria-hidden="true">
    <div class="settings-lock-card">
      <h2 style="margin-top:0">Settings Locked</h2>
      <p class="small">Enter the Stats Settings PIN.</p>
      <label for="unlockPin">PIN</label>
      <input id="unlockPin" type="password" inputmode="numeric" autocomplete="off">
      <button id="unlockBtn" class="btn primary" type="button" style="width:100%;margin-top:12px">Unlock Settings</button>
      <div id="unlockStatus" class="small status"></div>
    </div>
  </div>

  <div id="appWrap" style="display:none">
    <div id="settingsShell">
      <aside id="settingsSidebar" aria-label="Settings navigation">
        <div class="settings-brand">
          <div class="settings-brand-title">Stats</div>
          <div class="settings-brand-subtitle">Build the display</div>
        </div>
        <button id="settingsBack" class="btn" type="button">← Back to Display</button>
        <nav id="settingsNav" role="tablist" aria-orientation="vertical">
          <button class="settings-nav-button" type="button" role="tab" data-settings-target="settingsData">Data</button>
          <button class="settings-nav-button" type="button" role="tab" data-settings-target="settingsFilters">Filters</button>
          <button class="settings-nav-button" type="button" role="tab" data-settings-target="settingsScreens">Screens</button>
          <button class="settings-nav-button" type="button" role="tab" data-settings-target="settingsDisplay">Display</button>
        </nav>
        <div class="settings-sidebar-footer">Source → Data → Filters → Screens → Display</div>
      </aside>

      <main id="settingsMain">
        <header id="settingsHeader">
          <div>
            <h1 id="settingsPageTitle">Settings</h1>
            <div id="settingsPageDescription"></div>
          </div>
        </header>
        <div id="settingsContent">
          <div id="settingsContentInner">
            <section class="settings-section" id="settingsData" data-settings-title="Data" data-settings-description="Connect Sources, configure Reports and inspect the data Stats actually pulled."><div id="settingsDataHost"></div></section>
            <section class="settings-section" id="settingsFilters" data-settings-title="Filters" data-settings-description="Create and test reusable Filters against pulled Report data."><div id="settingsFiltersHost"></div></section>
            <section class="settings-section" id="settingsScreens" data-settings-title="Screens" data-settings-description="Choose Reports and Filters, build the presentation and test it live."><div id="settingsScreensHost"></div></section>
            <section class="settings-section" id="settingsDisplay" data-settings-title="Display" data-settings-description="Choose the active Screen and configure rotation."><div id="settingsDisplayHost"></div></section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/settings/runtime.js"></script>
  <script src="/static/settings/shell.js"></script>
  <script src="/static/settings/data.js"></script>
  <script src="/static/settings/filters.js"></script>
  <script src="/static/settings/screens.js"></script>
  <script src="/static/settings/display.js"></script>
</body>
</html>
