<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stats Settings</title>
  <link rel="stylesheet" href="/static/settings/workspace.css">
</head>
<body>
  <div id="settingsLock" class="lock" hidden>
    <form id="unlockForm" class="lock-card">
      <div class="eyebrow">Stats</div>
      <h1>Settings locked</h1>
      <p>Enter the settings PIN.</p>
      <label for="unlockPin">PIN</label>
      <input id="unlockPin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus>
      <button class="button primary" type="submit">Unlock</button>
      <div id="unlockMessage" class="message"></div>
    </form>
  </div>

  <div id="settingsApp" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div><strong>Stats</strong><span>Settings</span></div>
      </div>
      <nav id="settingsNav" class="nav" aria-label="Settings">
        <button type="button" data-section="data" class="active">Data</button>
        <button type="button" data-section="filters">Filters</button>
        <button type="button" data-section="screens">Screens</button>
        <button type="button" data-section="display">Display</button>
      </nav>
      <div class="sidebar-footer">
        <a class="button subtle" href="/">Open Display</a>
        <button id="lockSettings" class="button subtle" type="button">Lock Settings</button>
        <div id="versionText" class="version">Stats</div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div><div class="eyebrow">Workspace</div><h1 id="sectionTitle">Data</h1></div>
        <div id="globalMessage" class="message" role="status"></div>
      </header>
      <section class="workspace active" data-workspace="data" aria-label="Data"></section>
      <section class="workspace" data-workspace="filters" aria-label="Filters"></section>
      <section class="workspace" data-workspace="screens" aria-label="Screens"></section>
      <section class="workspace" data-workspace="display" aria-label="Display"></section>
    </main>
  </div>

  <script type="module" src="/static/settings/workspace-app.js"></script>
</body>
</html>
