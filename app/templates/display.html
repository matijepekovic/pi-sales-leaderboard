<script>
/* v37 precision formatting.
   Tableau shows split counts fractionally, rates to two decimals, and dollar
   calculations with cents. Do not round those values on the TV. */
fmt = function(v, type, symbol="$\"){
  const n = Number(v || 0);
  if(type === "currency"){
    return symbol + n.toLocaleString(undefined, {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }
  if(type === "percent") return n.toFixed(2) + "%";
  if(type === "number"){
    return n.toLocaleString(undefined, {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    });
  }
  return esc(v);
};
</script>
