<section class="settings-section" id="settingsSoftware" data-settings-title="Software" data-settings-description="See the installed version and install a signed Stats update.">
  <div class="card">
    <div class="settings-toolbar">
      <div>
        <h2>Software</h2>
        <div id="softwareVersionCurrent" class="strong">Software version: checking…</div>
      </div>
    </div>
    <p class="small">Updates use the signed public Stats update feed. Settings data stays outside the application files.</p>
    <div class="row">
      <button id="softwareCheckUpdate" class="btn" type="button">Check for Updates</button>
      <button id="softwareInstallUpdate" class="btn primary" type="button" disabled>Update</button>
    </div>
    <div id="softwareUpdateStatus" class="small settings-status"></div>
  </div>
</section>
