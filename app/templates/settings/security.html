<section class="settings-section" id="settingsSecurity" data-settings-title="Security" data-settings-description="Control access to Stats Settings.">
  <div class="card"><h2>Settings Lock</h2><p class="small">The PIN protects Settings. The TV display remains available.</p><div class="grid"><div><label for="pinCurrent">Current PIN</label><input id="pinCurrent" type="password" inputmode="numeric" autocomplete="off"></div><div><label for="pinNew">New PIN</label><input id="pinNew" type="password" inputmode="numeric" autocomplete="off" placeholder="4+ digits; blank removes it"></div></div><div class="row" style="margin-top:12px"><button id="savePin" class="btn primary" type="button">Save PIN</button><button id="lockNow" class="btn" type="button">Lock Settings Now</button></div><div id="pinStatus" class="small settings-status"></div></div>
</section>
