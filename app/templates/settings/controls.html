<section class="settings-section" id="settingsControls" data-settings-title="Controls" data-settings-description="Operate the TV and manage temporary display controls without changing Screen filter mappings.">
  <div class="card">
    <h2>TV Controls</h2>
    <p class="small">Control the fullscreen Stats TV process from Settings.</p>
    <div class="row">
      <button id="refreshTV" class="btn primary" type="button">Refresh TV View</button>
      <button id="fullscreenTV" class="btn" type="button">Force Fullscreen TV</button>
      <button id="restartTV" class="btn" type="button">Restart Stats</button>
      <button id="openTV" class="btn" type="button">Open TV View</button>
    </div>
    <div id="tvControlStatus" class="small settings-status"></div>
  </div>

  <div id="settingsTemporaryDateControls"></div>
  <div id="settingsQrControls"></div>
</section>
