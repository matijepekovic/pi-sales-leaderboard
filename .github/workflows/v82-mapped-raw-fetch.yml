name: v82 mapped raw fetch regression
permissions:
  contents: write
on:
  push:
    branches: [build/v82-mapped-raw-fetch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply v82 fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/sources/tableau_mapped.py')
          s = p.read_text()
          needle = '''    def _pull_rows(self):\n'''
          insert = '''    def fetch_csv(self, base, token, site_id, start, end):\n        \"\"\"Fetch the selected report without the shipped RepTotals shape gate.\n\n        CustomTableauSource inherits tableau.TableauSource.fetch_csv(), whose\n        final step verifies SR-Name / Measure Names / Measure Values and the\n        original summary measures. That is correct for the default board but\n        wrong for a report that has not been mapped yet: discovery and mapped\n        parsing must be allowed to see the report's raw export first.\n\n        Call the lower transport/filter implementation directly. It still uses\n        this custom source's _view_id(), sign-in, dates, REST request handling\n        and Olympia filter attempt; it skips only the original report's shape\n        validator.\n        \"\"\"\n        return _base.TableauSource.fetch_csv(\n            self, base, token, site_id, start, end\n        )\n\n    def _pull_rows(self):\n'''
          if 'def fetch_csv(self, base, token, site_id, start, end):' not in s[s.index('class MappedTableauSource'):]:
              if needle not in s:
                  raise SystemExit('MappedTableauSource _pull_rows insertion point not found')
              s = s.replace(needle, insert, 1)
              p.write_text(s)
          Path('VERSION').write_text('82\n')
          PY
      - name: Static checks
        run: |
          python -m py_compile app/sources/tableau_mapped.py app/source_picker.py
          test "$(cat VERSION)" = 82
          grep -q 'return _base.TableauSource.fetch_csv' app/sources/tableau_mapped.py
      - name: Regression test without stubbing fetch_csv
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          from sources import tableau_v36_base as base
          from sources.tableau import TableauSource
          from sources.tableau_custom import CustomTableauSource
          from sources.tableau_mapped import MappedTableauSource
          import source_picker

          csv_text = """Sales Rep,Home Branch,Gross Split,Close Rate
          Ana Reyes,Olympia,32.14,0.50
          Ben Ortiz,Olympia,18.25,0.25
          """

          def wire(source):
              source._view_id = lambda base_url, token, site_id: 'view-1'
              source._query_view_csv = lambda base_url, token, site_id, view_id, start, end, branch: csv_text
              return source

          # This is the regression: mapped reports must receive raw CSV even
          # though they do not have the shipped long-format columns.
          mapped = wire(MappedTableauSource({}, 'AnyWorkbook', 'AnySheet', {}))
          got = mapped.fetch_csv('base', 'token', 'site', '2026-08-01', '2026-08-31')
          assert got == csv_text

          # The stock/custom rep connector must remain strict. Same transport,
          # same CSV, but its original shape validator should still reject it.
          strict = wire(CustomTableauSource({}, 'AnyWorkbook', 'AnySheet'))
          try:
              strict.fetch_csv('base', 'token', 'site', '2026-08-01', '2026-08-31')
          except base.TableauError as exc:
              message = str(exc)
              assert 'Measure Names' in message and 'Measure Values' in message, message
          else:
              raise AssertionError('stock CustomTableauSource unexpectedly accepted a wide report')

          # Exercise the actual phone flows. Patch only transport/sign-in on
          # the class; report_columns/preview_pull still call real fetch_csv.
          old_signin = MappedTableauSource.signin
          old_signout = MappedTableauSource.signout
          old_view = MappedTableauSource._view_id
          old_query = MappedTableauSource._query_view_csv
          try:
              MappedTableauSource.signin = lambda self: ('base', 'token', 'site')
              MappedTableauSource.signout = lambda self, base_url, token: None
              MappedTableauSource._view_id = lambda self, base_url, token, site_id: 'view-1'
              MappedTableauSource._query_view_csv = lambda self, base_url, token, site_id, view_id, start, end, branch: csv_text

              desc = source_picker.report_columns({}, 'AnyWorkbook', 'AnySheet')
              assert desc['shape'] == 'wide', desc
              assert desc['headers'] == ['Sales Rep', 'Home Branch', 'Gross Split', 'Close Rate'], desc
              assert desc['samples']['Sales Rep'] == 'Ana Reyes', desc

              mapping = {
                  'rep_name': 'Sales Rep',
                  'home_branch': 'Home Branch',
                  'team': '',
                  'metrics': {
                      'gross_split': 'Gross Split',
                      'close_rate': 'Close Rate',
                  },
              }
              _start, _end, rows, notes = source_picker.preview_pull(
                  {}, 'AnyWorkbook', 'AnySheet', mapping
              )
              assert len(rows) == 2, rows
              assert rows[0]['rep_name'] == 'Ana Reyes', rows[0]
              assert abs(rows[0]['gross_split'] - 32.14) < 0.001, rows[0]
              assert abs(rows[0]['close_rate'] - 50.0) < 0.001, rows[0]
              assert notes['shape'] == 'wide', notes
          finally:
              MappedTableauSource.signin = old_signin
              MappedTableauSource.signout = old_signout
              MappedTableauSource._view_id = old_view
              MappedTableauSource._query_view_csv = old_query

          # With nothing picked the factory still returns the original source.
          default_source = source_picker.resolve_source({})
          assert type(default_source) is TableauSource, type(default_source)
          print('v82 mapped raw-fetch regression passed')
          PY
      - name: Production boundary
        run: |
          changed=$(git diff --name-only)
          echo "$changed"
          ! echo "$changed" | grep -Eq '^(app/sources/tableau.py|app/sources/tableau_v36_base.py|app/sources/tableau_products.py|app/templates/display.html|app/source_picker.py)$'
      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION app/sources/tableau_mapped.py
          git diff --cached --quiet || git commit -m 'v82: let mapped reports fetch raw CSV before mapping'
          git push origin HEAD:build/v82-mapped-raw-fetch
