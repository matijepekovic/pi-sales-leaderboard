name: Bundled application update
on:
  push:
    branches: [main, fix/leaderboard-printer-update]
    paths: ['app/**', 'printer_app/**', 'VERSION', '.github/workflows/bundled-update.yml']
  pull_request:
    paths: ['app/**', 'printer_app/**', 'VERSION', '.github/workflows/bundled-update.yml']
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact update ZIP
        run: git archive --format=zip HEAD -o /tmp/leaderboard-update.zip
      - uses: actions/upload-artifact@v4
        with:
          name: leaderboard-update
          path: /tmp/leaderboard-update.zip
          retention-days: 7
