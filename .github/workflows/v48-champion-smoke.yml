name: v48 Champion Asset Smoke
on:
  push:
    branches: [build/champion-asset-v48]
    paths:
      - app/static/champion-row-asset-fix.js
      - app/templates/display.html
      - VERSION
      - .github/workflows/v48-champion-smoke.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/champion-asset-v48
          fetch-depth: 0
      - name: JavaScript syntax
        run: node --check app/static/champion-row-asset-fix.js
      - name: Integration checks
        run: |
          grep -q 'symbol="$"' app/templates/display.html
          grep -q 'champion-row-asset-fix.js?v=48' app/templates/display.html
          test "$(tr -d '\n' < VERSION)" = "48"
      - name: Verify display-only diff
        run: |
          git fetch origin main
          CHANGED="$(git diff --name-only origin/main...HEAD | grep -v '^.github/workflows/v48-champion-smoke.yml$')"
          printf '%s\n' "$CHANGED"
          test -z "$(printf '%s\n' "$CHANGED" | grep -E '^(app/server.py|app/database.py|app/sources/|app/themes.py|app/templates/settings)' || true)"
