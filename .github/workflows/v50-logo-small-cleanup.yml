name: v50 Logo Small Cleanup
on:
  push:
    branches: [build/v50-logo-small-cleanup]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v50-logo-small-cleanup
          fetch-depth: 0
      - name: Apply v50 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # ---- Server: these Tableau identity fields remain stored but can no
          # longer be selected or rendered as TV stats. ----
          server = Path('app/server.py')
          s = server.read_text()
          old = '''MODES = {\n    "whole_office": "Whole Office",\n    "team_vs_team": "Team vs Team",\n    "all_teams": "All Teams",\n    "per_team": "Per Team",\n}\n'''
          new = old + '\nNON_DISPLAY_METRICS = {"home_branch", "title", "hire_date"}\n'
          if old not in s:
              raise SystemExit('MODES block not found')
          s = s.replace(old, new, 1)

          old = '    visible = settings["visible_metrics"].get(mode, [])\n'
          new = '    visible = [\n        key for key in settings["visible_metrics"].get(mode, [])\n        if key not in NON_DISPLAY_METRICS\n    ]\n'
          if old not in s:
              raise SystemExit('visible metrics assignment not found')
          s = s.replace(old, new, 1)

          old = '''        "metrics": [\n            {"key": key, "label": label, "type": typ}\n            for key, label, typ in METRIC_DEFS\n        ],'''
          new = '''        "metrics": [\n            {"key": key, "label": label, "type": typ}\n            for key, label, typ in METRIC_DEFS\n            if key not in NON_DISPLAY_METRICS\n        ],'''
          if old not in s:
              raise SystemExit('api_config metric list not found')
          s = s.replace(old, new, 1)

          old = '    valid_keys = {k for k, _, _ in METRIC_DEFS}\n'
          new = '    valid_keys = {k for k, _, _ in METRIC_DEFS if k not in NON_DISPLAY_METRICS}\n'
          if old not in s:
              raise SystemExit('valid_keys block not found')
          s = s.replace(old, new, 1)
          server.write_text(s)

          # ---- Theme engine: first-class Logo Small asset slot. ----
          themes = Path('app/themes.py')
          t = themes.read_text()
          old = '    "hero": {"label": "Hero / Header Art", "builtin": "hero.png"},\n'
          new = old + '    "logo_small": {"label": "Logo Small", "builtin": "hero.png"},\n'
          if old not in t:
              raise SystemExit('theme hero asset not found')
          t = t.replace(old, new, 1)
          themes.write_text(t)

          # ---- Asset collection catalog: UNDISPUTED is the existing collection;
          # add Logo Small as a collection item and whole-bundle asset. ----
          catalog_path = Path('app/static/asset-library/catalog.json')
          catalog = json.loads(catalog_path.read_text())
          cats = catalog.setdefault('categories', [])
          if not any(c.get('key') == 'logo_small' for c in cats):
              cats.insert(0, {"key": "logo_small", "label": "Logo Small"})
          for collection in catalog.setdefault('collections', []):
              bundle = collection.setdefault('bundle', {})
              if collection.get('key') == 'undisputed':
                  bundle['logo_small'] = '/static/theme-packs/undisputed/hero.png'
              small = bundle.get('logo_small') or bundle.get('hero')
              if small and not any(i.get('category') == 'logo_small' for i in collection.setdefault('items', [])):
                  collection['items'].insert(0, {
                      "key": f"{collection.get('key','collection')}-logo-small",
                      "category": "logo_small",
                      "label": "Logo Small",
                      "targets": {"logo_small": small},
                  })
          catalog['version'] = 3
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n')

          # ---- Future collection compatibility: if a collection provides
          # bundle.logo_small, Theme Studio automatically exposes it even when
          # the catalog author omits a separate item. Older hero-based packs can
          # also fall back to bundle.hero. ----
          library = Path('app/static/asset-library.js')
          a = library.read_text()
          a = a.replace('const CATALOG_URL="/static/asset-library/catalog.json?v=44";',
                        'const CATALOG_URL="/static/asset-library/catalog.json?v=50";')
          old = '''  async function loadCatalog(){\n    const response=await request(CATALOG_URL);\n    catalog=await response.json();\n    return catalog;\n  }\n'''
          new = '''  function normalizeCatalog(raw){\n    const next=(raw&&typeof raw==="object")?raw:{categories:[],collections:[]};\n    next.categories=Array.isArray(next.categories)?next.categories:[];\n    if(!next.categories.some(c=>c?.key==="logo_small")){\n      next.categories.unshift({key:"logo_small",label:"Logo Small"});\n    }\n    next.collections=(Array.isArray(next.collections)?next.collections:[]).map(collection=>{\n      const c={...collection,bundle:{...(collection.bundle||{})},items:[...(collection.items||[])]};\n      const small=c.bundle.logo_small||c.bundle.hero||null;\n      if(small){\n        c.bundle.logo_small=small;\n        if(!c.items.some(item=>item?.category==="logo_small")){\n          c.items.unshift({\n            key:`${c.key||"collection"}-logo-small`,\n            category:"logo_small",\n            label:"Logo Small",\n            targets:{logo_small:small}\n          });\n        }\n      }\n      return c;\n    });\n    return next;\n  }\n\n  async function loadCatalog(){\n    const response=await request(CATALOG_URL);\n    catalog=normalizeCatalog(await response.json());\n    return catalog;\n  }\n'''
          if old not in a:
              raise SystemExit('loadCatalog block not found')
          a = a.replace(old, new, 1)
          library.write_text(a)

          # ---- Whole Office presentation: remove mode text and decorate Team
          # cells with Logo Small, falling back to the Team Builder logo. ----
          cleanup = Path('app/static/whole-office-cleanup-v50.js')
          cleanup.write_text(r'''/* v50 Whole Office presentation cleanup.
   Data/ranking remain owned by the existing renderer. This layer only removes
   the redundant mode label and adds a small team identity asset beside Team. */
(function(){
  if(typeof render!=="function") return;
  const previousRender=render;
  const STYLE_ID="v50WholeOfficeIdentityStyles";

  function ensureStyles(){
    if(document.getElementById(STYLE_ID)) return;
    const style=document.createElement("style");
    style.id=STYLE_ID;
    style.textContent=`
      #scaleRoot td.v50-team-cell{padding-top:5px;padding-bottom:5px}
      #scaleRoot .v50-team-identity{display:inline-flex;align-items:center;gap:8px;min-width:0;vertical-align:middle}
      #scaleRoot .v50-team-logo{width:clamp(36px,3vw,56px);height:clamp(24px,2.4vw,42px);object-fit:contain;flex:0 0 auto}
      #scaleRoot .v50-team-name{white-space:nowrap}
    `;
    document.head.appendChild(style);
  }

  function teamTheme(data,name){
    return data?.theme_state?.by_name?.[String(name||"").trim().toLowerCase()]||null;
  }

  function decorateWholeOffice(data){
    if(data?.mode!=="whole_office") return;
    const mode=document.getElementById("modeLabel");
    if(mode) mode.textContent="";

    const metrics=Array.isArray(data.metrics)?data.metrics:[];
    const teamIndex=metrics.indexOf("team");
    if(teamIndex<0) return;

    const table=document.querySelector("#scaleRoot table");
    if(!table) return;
    ensureStyles();

    table.querySelectorAll("tbody tr:not(.total-row)").forEach(row=>{
      const cell=row.cells[teamIndex];
      if(!cell) return;
      const teamName=String(cell.textContent||"").trim();
      if(!teamName) return;
      const theme=teamTheme(data,teamName);
      const teamId=Number(theme?.team_id||0);
      const small=theme?.assets?.logo_small||null;
      const fallback=teamId?`/api/teams/${teamId}/logo?v=${Number(data.organization_version||0)}`:null;
      const src=small||fallback;
      if(!src) return;

      cell.classList.add("v50-team-cell");
      cell.textContent="";
      const wrap=document.createElement("span");
      wrap.className="v50-team-identity";
      const img=document.createElement("img");
      img.className="v50-team-logo";
      img.src=src;
      img.alt="";
      img.addEventListener("error",()=>img.remove(),{once:true});
      const label=document.createElement("span");
      label.className="v50-team-name";
      label.textContent=teamName;
      wrap.append(img,label);
      cell.appendChild(wrap);
    });
  }

  render=function(data){
    const result=previousRender(data);
    decorateWholeOffice(data);
    return result;
  };
})();
''')

          # Load display cleanup last so it sees the final existing render output.
          display = Path('app/templates/display.html')
          d = display.read_text()
          if 'whole-office-cleanup-v50.js' not in d:
              d = d.rstrip() + '\n<script src="/static/whole-office-cleanup-v50.js?v=50"></script>\n'
          display.write_text(d)

          settings = Path('app/templates/settings.html')
          sh = settings.read_text().replace('/static/asset-library.js?v=44', '/static/asset-library.js?v=50')
          settings.write_text(sh)

          Path('VERSION').write_text('50\n')
          PY
      - name: Validate
        run: |
          python -m py_compile app/server.py app/themes.py
          node --check app/static/asset-library.js
          node --check app/static/whole-office-cleanup-v50.js
          python - <<'PY'
          import json
          c=json.load(open('app/static/asset-library/catalog.json'))
          assert any(x['key']=='logo_small' for x in c['categories'])
          for collection in c['collections']:
              assert 'logo_small' in collection['bundle'] or 'hero' in collection['bundle']
          PY
          grep -q '"logo_small": {"label": "Logo Small"' app/themes.py
          grep -q 'NON_DISPLAY_METRICS = {"home_branch", "title", "hire_date"}' app/server.py
          grep -q 'whole-office-cleanup-v50.js?v=50' app/templates/display.html
          ! grep -q 'catalog.json?v=44' app/static/asset-library.js
          test "$(tr -d '\n' < VERSION)" = "50"
      - name: Commit patch
        run: |
          git config user.name "matijepekovic"
          git config user.email "122064226+matijepekovic@users.noreply.github.com"
          git add app/server.py app/themes.py app/static/asset-library/catalog.json app/static/asset-library.js app/static/whole-office-cleanup-v50.js app/templates/display.html app/templates/settings.html VERSION
          git commit -m "v50: add small-logo asset and clean TV fields"
          git push origin HEAD:build/v50-logo-small-cleanup
