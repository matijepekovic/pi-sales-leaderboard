name: v98 remote accordion test
permissions:
  contents: read
on:
  push:
    branches: [build/v98-remote-accordion]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax and production boundary
        run: |
          node --check app/static/settings-accordion-v98.js
          test "$(cat VERSION)" = 98
          grep -q 'settings-accordion-v98.js?v=98' app/templates/settings.html
          changed=$(git diff origin/main --name-only | grep -v '^.github/workflows/v98-remote-accordion-test.yml$' | sort)
          echo "$changed"
          test "$(echo "$changed" | tr '\n' ' ')" = "VERSION app/static/settings-accordion-v98.js app/templates/settings.html "
          ! git diff origin/main --name-only | grep -Eq '^(app/sources/|app/source_picker.py|app/tableau_scheduler.py|server.py|app/templates/display.html)'
      - name: DOM grouping behavior
        run: |
          npm init -y >/dev/null 2>&1
          npm install jsdom@24 >/dev/null 2>&1
          node <<'JS'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const html=`<!doctype html><html><head></head><body>
          <div id="appWrap">
            <div class="persist-note">persist</div>
            <div class="card" id="modeCard"><div class="grid">
              <div><label>Title</label><input id="title"></div>
              <div><label>Subtitle</label><input id="subtitle"></div>
              <div id="activeWrap"><label>Active TV Mode</label><select id="activeMode"></select></div>
              <div><label>Refresh</label><input id="refresh"></div>
            </div></div>
            <div class="card" id="displayCard"><h2 id="displaySettingsTitle">Display Settings</h2>
              <div id="activeModeHelp">help</div>
              <div id="rankWrap"><label>Rank By</label><select id="sortMetric"></select></div>
              <h3>Data shown on TV</h3><div id="metrics"></div></div>
            <div class="card" id="teamCard"><h2>Team Builder</h2><button id="newTeamBuilder">New</button></div>
            <div class="card" id="pullCard"><h2>Pull Status</h2><p id="sourceStatusLine">status</p>
              <button id="pullNowOutside">Pull</button><button id="openDataSource">Login</button><button id="loadDemo">Demo</button></div>
            <div class="card" id="tvCard"><h2>TV Controls</h2><div class="row"><button id="refreshTV">Refresh</button></div></div>
            <div class="card" id="software"><h2>Software Update</h2></div>
            <div class="card" id="security"><h2>Settings Lock</h2></div>
            <div class="card" id="v75NumCard"><h2>Number Size</h2><button id="v75NumPlus">+</button></div>
            <div class="card" id="v75ProductCard"><h2>Close Rate by Product <span>— BETA</span></h2><button id="v75ProductRefresh">Refresh</button></div>
            <div class="card" id="v90SourceCard"><h2>Tableau Report</h2><div>intro</div><div id="scheduleBox"><div id="v79Current">current</div></div><button id="v79Load">Read</button></div>
            <div class="actions"><button id="save">Save Display Settings</button><button id="openTV">Open TV</button><span id="saved"></span></div>
          </div></body></html>`;
          const dom=new JSDOM(html,{url:'http://pi/settings',runScripts:'dangerously'});
          const {window}=dom;
          window.eval(fs.readFileSync('app/static/settings-accordion-v98.js','utf8'));
          window.document.dispatchEvent(new window.Event('DOMContentLoaded'));
          setTimeout(()=>{
            const d=window.document;
            const top=[...d.querySelectorAll('#v98Sections > details.v98-section > summary')].map(x=>x.textContent.trim());
            const expect=['View','TV Remote','Team Builder','Data','Software','Security'];
            if(JSON.stringify(top)!==JSON.stringify(expect)) throw new Error('top sections '+JSON.stringify(top));
            const data=[...d.querySelectorAll('#v98Sections > details')].find(x=>x.querySelector(':scope > summary').textContent==='Data');
            const view=[...d.querySelectorAll('#v98Sections > details')].find(x=>x.querySelector(':scope > summary').textContent==='View');
            const tv=[...d.querySelectorAll('#v98Sections > details')].find(x=>x.querySelector(':scope > summary').textContent==='TV Remote');
            if(!data.contains(d.querySelector('#v90SourceCard'))) throw new Error('report not in Data');
            if(!data.contains(d.querySelector('#v75ProductCard'))) throw new Error('product not in Data');
            if(!d.querySelector('#v90SourceCard #v98PullStatus #sourceStatusLine')) throw new Error('pull status not inside Tableau Report');
            if(d.querySelector('#pullCard')) throw new Error('old Pull Status card still present');
            const filters=[...view.querySelectorAll('details.v98-subsection')].find(x=>x.querySelector(':scope > summary').textContent==='Filters');
            if(!filters||!filters.contains(d.querySelector('#sortMetric'))||!filters.contains(d.querySelector('#metrics'))) throw new Error('filters not inside View');
            if(filters.contains(d.querySelector('#activeMode'))) throw new Error('active mode wrongly inside Filters');
            if(!view.contains(d.querySelector('#activeMode'))) throw new Error('active mode not in View');
            if(!view.contains(d.querySelector('#v75NumCard'))) throw new Error('number size not in View');
            if(!view.contains(d.querySelector('#save'))||d.querySelector('#save').textContent!=='Save View') throw new Error('save not in View');
            if(!tv.contains(d.querySelector('#openTV'))) throw new Error('Open TV not in TV Remote');
            if([...d.querySelectorAll('#v98Sections > details.v98-section')].some(x=>x.open)) throw new Error('top sections should start collapsed');
            if(!d.querySelector('#v90SourceCard #pullNowOutside')||!d.querySelector('#v90SourceCard #openDataSource')) throw new Error('pull/login controls lost');
            console.log('v98 DOM grouping passed');
          },100);
          setTimeout(()=>process.exit(0),180);
          JS
