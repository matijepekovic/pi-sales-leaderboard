name: v53 Comparison Team Cards
on:
  push:
    branches: [build/v53-comparison-team-cards]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v53-comparison-team-cards
          fetch-depth: 0
      - name: Fix generated syntax and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/static/comparison-team-cards-v53.js')
          s=p.read_text()
          s=s.replace('const shade=index===0?.30:.48;', 'const shade=index===0 ? .30 : .48;')
          p.write_text(s)
          PY
          node --check app/static/comparison-team-cards-v53.js
          grep -q 'if(count===4) return {cols:2,rows:2};' app/static/comparison-team-cards-v53.js
          grep -q 'summary.logo_url' app/static/comparison-team-cards-v53.js
          grep -q '#title,#subtitle{display:none!important}' app/static/comparison-team-cards-v53.js
          grep -q 'comparison-team-cards-v53.js?v=53' app/templates/display.html
          test "$(tr -d '\n' < VERSION)" = "53"
      - name: Ensure design-only diff
        run: |
          files="$(git diff --name-only origin/main...HEAD)"
          echo "$files"
          bad="$(printf '%s\n' "$files" | grep -Ev '^(VERSION|app/templates/display.html|app/static/comparison-team-cards-v53.js|\.github/workflows/v53-comparison-team-cards.yml)$' || true)"
          test -z "$bad"
      - name: Commit syntax fix
        run: |
          git config user.name "matijepekovic"
          git config user.email "122064226+matijepekovic@users.noreply.github.com"
          git add app/static/comparison-team-cards-v53.js
          git diff --cached --quiet || git commit -m "v53: validate adaptive comparison cards"
          git push origin HEAD:build/v53-comparison-team-cards
