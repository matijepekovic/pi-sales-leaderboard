name: Production release security

on:
  pull_request:
    branches:
      - production
    paths:
      - "app/stats_core/windows/signing_key.py"
      - "scripts/sign_release_manifest.py"
      - "scripts/verify_release_manifest.py"
      - "RELEASE_SECURITY.md"
      - ".github/workflows/production-release-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Validate production public key and version
        run: |
          PYTHONPATH=app python - <<'PY'
          import base64
          import re
          from stats_core.windows.signing_key import UPDATE_SIGNING_PUBLIC_KEY_B64

          raw = base64.b64decode(UPDATE_SIGNING_PUBLIC_KEY_B64, validate=True)
          if len(raw) != 32:
              raise SystemExit("production Ed25519 public key must be 32 bytes")

          version = open("VERSION", encoding="utf-8").read().strip()
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", version):
              raise SystemExit("production VERSION must be MAJOR.MINOR.PATCH")
          print(f"production release key and VERSION {version} are valid")
          PY

      - name: Exercise manifest signing and verification
        run: |
          mkdir -p dist
          printf 'Stats release signing self-test\n' > dist/self-test.bin

          python - <<'PY'
          import base64
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          private = Ed25519PrivateKey.generate()
          public = private.public_key()
          Path("/tmp/release-test-private.pem").write_bytes(
              private.private_bytes(
                  encoding=serialization.Encoding.PEM,
                  format=serialization.PrivateFormat.PKCS8,
                  encryption_algorithm=serialization.NoEncryption(),
              )
          )
          Path("/tmp/release-test-public.b64").write_text(
              base64.b64encode(
                  public.public_bytes(
                      encoding=serialization.Encoding.Raw,
                      format=serialization.PublicFormat.Raw,
                  )
              ).decode("ascii"),
              encoding="utf-8",
          )
          PY

          UPDATE_SIGNING_PRIVATE_KEY="$(cat /tmp/release-test-private.pem)" \
            python scripts/sign_release_manifest.py \
              --version "$(cat VERSION)" \
              --output-dir dist \
              dist/self-test.bin

          python scripts/verify_release_manifest.py \
            --manifest dist/release-manifest.json \
            --signature dist/release-manifest.json.sig \
            --asset-dir dist \
            --public-key-b64 "$(cat /tmp/release-test-public.b64)"
