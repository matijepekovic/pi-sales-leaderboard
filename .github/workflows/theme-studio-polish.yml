name: One-time Theme Studio polish

on:
  push:
    branches:
      - build/theme-studio-v42
    paths:
      - .github/workflows/theme-studio-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/theme-studio-v42
          fetch-depth: 0

      - name: Make comparison theme mapping immune to filtered team ordering
        shell: python
        run: |
          from pathlib import Path
          p=Path("app/static/theme-runtime.js")
          text=p.read_text()
          old='''    if(data.mode==="team_vs_team"){
      const cards=[...document.querySelectorAll(".vs-card")];
      (data.teams||[]).slice(0,cards.length).forEach((team,i)=>{
        const s=team.summary||{};cardTheme(cards[i],lookupTheme(data,s.team,s.team_id));
      });
    }else if(data.mode==="all_teams"){
      const cards=[...document.querySelectorAll(".all-card")];
      (data.teams||[]).slice(0,cards.length).forEach((team,i)=>{
        const s=team.summary||{};cardTheme(cards[i],lookupTheme(data,s.team,s.team_id));
      });
    }
'''
          new='''    if(data.mode==="team_vs_team"){
      const cards=[...document.querySelectorAll(".vs-card")];
      cards.forEach(card=>{
        const name=card.querySelector(".vs-name")?.textContent?.trim()||"";
        cardTheme(card,lookupTheme(data,name,null));
      });
    }else if(data.mode==="all_teams"){
      const cards=[...document.querySelectorAll(".all-card")];
      cards.forEach(card=>{
        const name=card.querySelector(".all-name")?.textContent?.trim()||"";
        cardTheme(card,lookupTheme(data,name,null));
      });
    }
'''
          if old not in text:
              raise SystemExit("Theme comparison patch anchor missing")
          p.write_text(text.replace(old,new,1))

      - name: Run backend integration checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt
          export PYTHONPATH="$PWD/app"
          export HOME="$RUNNER_TEMP/theme-home"
          mkdir -p "$HOME"
          python - <<'PY'
          from pathlib import Path
          from database import init_db, create_team, get_settings
          init_db()
          undisputed_id=create_team("UNDISPUTED")
          other_id=create_team("Buckshot")
          from themes import display_theme_state
          state=display_theme_state(get_settings())
          u=state["teams"][str(undisputed_id)]
          b=state["teams"][str(other_id)]
          assert u["base"]=="undisputed" and u["enabled"] is True
          assert b["base"]=="classic" and b["enabled"] is False
          assert u["assets"]["hero"].startswith("/static/theme-packs/undisputed/")
          for name in ("hero.png","bg.jpg","medallion.png","row.jpg","champ.jpg","ctl.png","ctr.png","cbl.png","cbr.png","totmark.png"):
              assert (Path("app/static/theme-packs/undisputed")/name).is_file(), name

          import server
          client=server.app.test_client()
          r=client.get("/api/themes")
          assert r.status_code==200, r.data
          payload=r.get_json()
          assert payload["ok"] is True
          r=client.get("/api/leaderboard")
          assert r.status_code==200, r.data
          assert "theme_state" in r.get_json()
          r=client.get("/static/theme-packs/undisputed/hero.png")
          assert r.status_code==200 and len(r.data)>100000
          print("Theme backend integration checks passed")
          PY
          python -m py_compile app/server.py app/database.py app/themes.py app/sources/tableau.py
          node --check app/static/theme-runtime.js
          node --check app/static/theme-studio.js

      - name: Remove one-time workflow
        run: rm -f .github/workflows/theme-studio-polish.yml

      - name: Commit polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pi-sales-leaderboard build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "v43: validate Theme Studio runtime integration"
          git push origin HEAD:build/theme-studio-v42
