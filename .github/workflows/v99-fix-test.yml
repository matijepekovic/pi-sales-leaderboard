name: v99 fix test guard
permissions:
  contents: write
on:
  push:
    branches:
      - build/v99-clean-data-ux
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix boundary guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/v99-clean-data-ux.yml')
          s = p.read_text()
          old = "changed=$(git diff origin/main --name-only | sort)"
          new = "changed=$(git diff origin/main --name-only | grep -v '^.github/' | sort)"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v99-clean-data-ux.yml
          git diff --cached --quiet || git commit -m 'fix v99 boundary guard'
          git push origin HEAD:build/v99-clean-data-ux
