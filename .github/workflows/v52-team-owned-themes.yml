name: v52 Team Owned Themes
on:
  push:
    branches: [build/v51-winning-team-whole-office]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v51-winning-team-whole-office
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v52_patch.py
      - name: Validate
        run: |
          python -m py_compile app/themes.py
          node --check app/static/theme-studio.js
          ! grep -q 'Whole Office Theme' app/static/theme-studio.js
          ! grep -q 'Whole Office has its own separate theme' app/static/theme-studio.js
          grep -q 'Whole Office automatically inherits' app/static/theme-studio.js
          ! grep -q '"office": effective_theme' app/themes.py
          grep -q 'cannot have its own theme' app/themes.py
          grep -q 'theme-studio.js?v=52' app/templates/settings.html
          test "$(tr -d '\n' < VERSION)" = "52"
      - name: Commit patch
        run: |
          git config user.name "matijepekovic"
          git config user.email "122064226+matijepekovic@users.noreply.github.com"
          git add app/themes.py app/static/theme-studio.js app/templates/settings.html VERSION
          git diff --cached --quiet || git commit -m "v52: make themes team-owned only"
          git push origin HEAD:build/v51-winning-team-whole-office
