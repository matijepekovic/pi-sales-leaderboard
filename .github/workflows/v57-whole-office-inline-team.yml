name: v57 Whole Office Inline Team
on:
  push:
    branches: [build/v57-whole-office-inline-team]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate presentation override
        run: |
          node --check app/static/whole-office-inline-team-v57.js
          grep -q 'display:flex!important' app/static/whole-office-inline-team-v57.js
          grep -q 'font-size:clamp(14px,.72vw,29px)!important' app/static/whole-office-inline-team-v57.js
          grep -q 'font-size:clamp(11px,.55vw,22px)!important' app/static/whole-office-inline-team-v57.js
          grep -q 'whole-office-inline-team-v57.js?v=57' app/templates/display.html
          test "$(tr -d '\n' < VERSION)" = "57"
      - name: Ensure display-only diff
        run: |
          files="$(git diff --name-only origin/main...HEAD)"
          echo "$files"
          bad="$(printf '%s\n' "$files" | grep -Ev '^(VERSION|app/templates/display.html|app/static/whole-office-inline-team-v57.js|\.github/workflows/v57-whole-office-inline-team.yml)$' || true)"
          test -z "$bad"
