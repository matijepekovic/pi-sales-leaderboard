name: v49 Hardcode Repo
on:
  push:
    branches: [build/v49-hardcode-repo]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v49-hardcode-repo
          fetch-depth: 0
      - name: Apply v49 patch
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('app/server.py')
          s = server.read_text()

          s = s.replace(
              'GITHUB_API_ROOT = "https://api.github.com"\nGITHUB_CHECK_SECONDS = 15 * 60',
              'GITHUB_API_ROOT = "https://api.github.com"\nHARD_CODED_GITHUB_REPO = "matijepekovic/pi-sales-leaderboard"\nGITHUB_CHECK_SECONDS = 15 * 60'
          )

          s = s.replace(
              '    for key in SECRET_SETTING_KEYS:\n        data.pop(key, None)\n',
              '    for key in SECRET_SETTING_KEYS:\n        data.pop(key, None)\n    # Update source is appliance-owned, not user-configurable.\n    data.pop("github_repo", None)\n'
          )

          old = '''    if isinstance(incoming.get("github_repo"), str):\n        repo_value = incoming["github_repo"].strip()\n        if repo_value:\n            try:\n                repo_value = normalize_github_repo(repo_value)\n            except ValueError as exc:\n                return jsonify({"ok": False, "error": str(exc)}), 400\n        current["github_repo"] = repo_value\n\n'''
          if old not in s:
              raise SystemExit('github_repo save block not found')
          s = s.replace(old, '')

          old = '''    settings = get_settings()\n    repo_value = settings.get("github_repo", "")\n\n    if not repo_value:\n        raise ValueError("Enter your public GitHub repository first.")\n\n'''
          if old not in s:
              raise SystemExit('check_github_update repo block not found')
          s = s.replace(old, '    repo_value = HARD_CODED_GITHUB_REPO\n\n')
          s = s.replace('Check the configured PUBLIC GitHub repository.', 'Check the built-in PUBLIC GitHub repository.')

          old = '            if settings.get("github_auto_update") and settings.get("github_repo"):\n'
          if old not in s:
              raise SystemExit('auto update condition not found')
          s = s.replace(old, '            if settings.get("github_auto_update"):\n')

          old = '        "repo": settings.get("github_repo", ""),\n'
          if old not in s:
              raise SystemExit('github status repo field not found')
          s = s.replace(old, '')
          server.write_text(s)

          settings = Path('app/templates/settings_v34_base.html')
          h = settings.read_text()
          old = '<div style="border-top:1px solid var(--line);margin-top:20px;padding-top:18px"><h3 style="margin-top:0">Automatic GitHub Updates</h3><div class="grid"><div><label for="githubRepo">Public GitHub repository</label><input id="githubRepo" type="text" placeholder="username/repository"></div><div><label class="row" style="margin-top:27px"><input id="githubAutoUpdate" type="checkbox"><span>Automatically install newer versions</span></label></div></div><div class="row" style="margin-top:12px"><button id="checkGithub" class="btn" type="button">Check GitHub Now</button></div><div id="githubUpdateStatus" class="small" style="margin-top:10px"></div></div>'
          new = '<div style="border-top:1px solid var(--line);margin-top:20px;padding-top:18px"><h3 style="margin-top:0">Automatic GitHub Updates</h3><label class="row"><input id="githubAutoUpdate" type="checkbox"><span>Automatically install newer versions</span></label><div class="row" style="margin-top:12px"><button id="checkGithub" class="btn" type="button">Check GitHub Now</button></div><div id="githubUpdateStatus" class="small" style="margin-top:10px"></div></div>'
          if old not in h:
              raise SystemExit('GitHub settings UI block not found')
          h = h.replace(old, new)
          h = h.replace('  $("githubRepo").value=config.github_repo||"";$("githubAutoUpdate").checked=!!config.github_auto_update;', '  $("githubAutoUpdate").checked=!!config.github_auto_update;')
          h = h.replace('config.github_repo=$("githubRepo").value.trim();config.github_auto_update=$("githubAutoUpdate").checked;', 'config.github_auto_update=$("githubAutoUpdate").checked;')
          old = '$("checkGithub").addEventListener("click",async()=>{if(!$("githubRepo").value.trim()){$("githubUpdateStatus").textContent="Enter the repo and save display settings first.";return;}$("checkGithub").disabled=true;'
          new = '$("checkGithub").addEventListener("click",async()=>{$("checkGithub").disabled=true;'
          if old not in h:
              raise SystemExit('GitHub check handler guard not found')
          h = h.replace(old, new)
          if 'githubRepo' in h:
              raise SystemExit('githubRepo still visible/referenced in settings template')
          settings.write_text(h)

          themed = Path('app/static/themed-team-layout.js')
          j = themed.read_text()
          old = '<div class="bt-side"><div class="top">Leaderboard</div><div class="bottom">${esc(data.subtitle||"")}</div></div>'
          new = '<div class="bt-side"><div class="bottom">${esc(data.subtitle||"")}</div></div>'
          if old not in j:
              raise SystemExit('themed Leaderboard label not found')
          themed.write_text(j.replace(old, new))

          display = Path('app/templates/display.html')
          d = display.read_text()
          if '/static/themed-team-layout.js?v=46' not in d:
              raise SystemExit('themed layout cache version not found')
          d = d.replace('/static/themed-team-layout.js?v=46', '/static/themed-team-layout.js?v=49')
          display.write_text(d)

          Path('VERSION').write_text('49\n')
          PY
      - name: Validate
        run: |
          python -m py_compile app/server.py
          node --check app/static/themed-team-layout.js
          grep -q 'HARD_CODED_GITHUB_REPO = "matijepekovic/pi-sales-leaderboard"' app/server.py
          ! grep -q 'githubRepo' app/templates/settings_v34_base.html
          ! grep -q '>Leaderboard</div><div class="bottom"' app/static/themed-team-layout.js
          grep -q 'themed-team-layout.js?v=49' app/templates/display.html
          test "$(tr -d '\n' < VERSION)" = "49"
      - name: Commit patch
        run: |
          git config user.name "matijepekovic"
          git config user.email "122064226+matijepekovic@users.noreply.github.com"
          git add app/server.py app/templates/settings_v34_base.html app/static/themed-team-layout.js app/templates/display.html VERSION
          git commit -m "v49: hardcode update repo and clean themed header"
          git push origin HEAD:build/v49-hardcode-repo
