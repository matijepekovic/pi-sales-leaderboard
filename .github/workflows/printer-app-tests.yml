name: Printer app tests
on:
  push:
    branches: [main, codex/printer-automation]
    paths: ['printer_app/**', 'scripts/update-printer-app.sh', '.github/workflows/printer-app-tests.yml']
  pull_request:
    paths: ['printer_app/**', 'scripts/update-printer-app.sh', '.github/workflows/printer-app-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  printer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent printer and browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev cups-client cups-daemon libreoffice-calc fonts-liberation fonts-dejavu-core python3-opencv python3-pil python3-pytest poppler-utils tesseract-ocr tesseract-ocr-eng
          python -m pip install -r printer_app/requirements.txt pytest xlwt 'playwright>=1.55,<2' 'opencv-python-headless>=4.10,<5'
          python -m playwright install --with-deps chromium webkit
      - name: MOD Sheet source and automation regressions
        run: |
          python -m pytest \
            printer_app/tests/test_salesforce_sandbox.py \
            printer_app/tests/test_mod_sheet_automation.py \
            printer_app/tests/test_gallery_reference.py \
            printer_app/tests/test_core.py::test_printer_one_sided_uses_verified_konica_print_type \
            printer_app/tests/test_core.py::test_printer_does_not_invent_konica_binding_for_two_sided_modes \
            printer_app/tests/test_core.py::test_printer_high_priority_maps_to_cups_priority_100 \
            printer_app/tests/test_core.py::test_immediate_generated_job_uses_high_printer_priority \
            -v

      - name: Gallery template fast-path regressions
        run: |
          python -m pytest \
            printer_app/tests/test_gallery_borders.py \
            printer_app/tests/test_gallery_template_ocr.py \
            printer_app/tests/test_gallery_recognition.py::test_tsv_quotes_cannot_swallow_rows_or_leak_geometry \
            printer_app/tests/test_gallery_recognition.py::test_header_geometry_works_when_address_label_is_unreadable \
            printer_app/tests/test_gallery_recognition.py::test_new_normalized_header_is_used_without_address_or_number_guessing \
            printer_app/tests/test_gallery_recognition.py::test_related_uses_one_character_name_or_exact_address_and_global_rename \
            printer_app/tests/test_gallery_recognition.py::test_existing_source_order_is_page_then_part_across_pagination \
            printer_app/tests/test_gallery_recognition.py::test_recognition_and_navigation_have_explicit_owners \
            printer_app/tests/test_gallery_pdf_date.py::test_known_pdf_date_skips_per_card_date_detection \
            -v -rs
      - name: Isolated CI-only CUPS sink (never a physical printer)
        run: |
          echo 'FileDevice Yes' | sudo tee -a /etc/cups/cups-files.conf
          sudo systemctl restart cups
          sudo lpadmin -p printer_app_ci -E -v file:/tmp/printer-app-ci-output -m raw
      - name: Tests, native browser forms, real LibreOffice conversion and CUPS receipt recovery
        env:
          PRINTER_CUPS_INTEGRATION: '1'
          PRINTER_BROWSER_TESTS: '1'
        run: |
          python -m compileall -q printer_app
          bash -n printer_app/install.sh printer_app/launch.sh scripts/update-printer-app.sh
          python -m pytest printer_app/tests -v
          /usr/bin/python3 -m pytest printer_app/tests/test_gallery_borders.py printer_app/tests/test_gallery_recognition.py -v
      - name: Standalone systemd deployment smoke test (no Stats service)
        run: |
          sudo useradd --create-home --shell /bin/bash scoreboard
          sudo mkdir -p /home/scoreboard/source
          sudo cp -R printer_app /home/scoreboard/source/
          sudo chown -R scoreboard:scoreboard /home/scoreboard/source
          echo 'scoreboard ALL=(root) NOPASSWD: /usr/bin/install, /usr/bin/systemctl' | sudo tee /etc/sudoers.d/printer-app-ci
          PYTHON="$(command -v python)"
          sudo -u scoreboard -H bash -c 'cd /home/scoreboard/source; "$1" -m printer_app.bootstrap init' _ "$PYTHON"
          sudo -u scoreboard -H sed -i 's/PRINTER_QUEUE=konicaa/PRINTER_QUEUE=printer_app_ci/' /home/scoreboard/.config/printer-app/env
          sudo -u scoreboard -H "$PYTHON" /home/scoreboard/source/printer_app/deploy.py install
          curl --fail http://127.0.0.1:5055/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5055/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5055/login)" = 404
          sudo systemctl stop printer-app-web.service
          sudo systemctl is-active --quiet printer-app-worker.service
          sudo systemctl start printer-app-web.service
          sudo systemctl stop printer-app-worker.service
          sudo systemctl is-active --quiet printer-app-web.service
          for i in $(seq 1 10); do curl -s http://127.0.0.1:5055/health >/tmp/printer-health.json && break || sleep 1; done
          python -c 'import json; assert json.load(open("/tmp/printer-health.json"))["worker_running"] is False'
      - name: Printer service diagnostics
        if: always()
        run: sudo journalctl -u printer-app-web.service -u printer-app-worker.service --no-pager -n 80
