name: v101 runner
permissions:
  contents: write
on:
  push:
    branches:
      - build/v101-preview-scroll
    paths:
      - '.github/v101_apply.py'
      - '.github/workflows/v101-run.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply
        run: python .github/v101_apply.py
      - name: Check
        run: |
          node --check app/static/data-source-v90.js
          python -m py_compile app/server.py
          python - <<'PY'
          from pathlib import Path
          js=Path('app/static/data-source-v90.js').read_text()
          server=Path('app/server.py').read_text()
          assert 'rows.slice(0,5)' not in js
          assert 'rows[:8]' not in server
          assert 'const body=rows.map(rep=>' in js
          assert 'max-height:55vh;overflow:auto' in js
          assert 'width:max-content;min-width:max-content' in js
          assert 'touch-action:pan-x pan-y' in js
          assert 'Object.prototype.hasOwnProperty.call(r,key)' in js
          assert 'data-source-v90.js?v=101' in Path('app/templates/settings.html').read_text()
          print('v101 checks passed')
          PY
      - name: Boundary
        run: |
          git fetch origin main
          actual=$(git diff --name-only origin/main | grep -v '^.github/' | sort)
          expected=$(printf '%s\n' VERSION app/server.py app/static/data-source-v90.js app/templates/settings.html | sort)
          test "$actual" = "$expected"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION app/server.py app/static/data-source-v90.js app/templates/settings.html
          git commit -m 'v101: make number preview scroll in both directions'
          git push origin HEAD:build/v101-preview-scroll
