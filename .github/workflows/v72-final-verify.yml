name: v72 final 4K verification
permissions:
  contents: write
on:
  push:
    branches: [build/v72-readable-tables-no-preview-zoom]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Generate v72 source
        run: |
          python .github/scripts/apply_v72.py
          python .github/scripts/apply_v72b.py
          node --check app/static/theme-studio.js
          node --check app/static/table-readability-v72.js
          test "$(cat VERSION)" = 72
          ! grep -q 'setZoom(' app/static/theme-studio.js
          ! grep -q 'installPreviewGestures(' app/static/theme-studio.js
      - name: Install
        run: |
          pip install -r requirements.txt
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Fixture and app
        env:
          HOME: ${{ runner.temp }}/pi-home
        run: |
          mkdir -p "$HOME"
          python - <<'PY'
          import sys
          sys.path.insert(0,'app')
          from database import init_db,replace_reps,get_team_definitions,assign_rep_to_team,get_settings,save_settings
          init_db(); rows=[]
          for ti,team in enumerate(['UNDISPUTED','Bravo']):
            for i in range(4):
              issued=6+i;sold=1+i%3;gross=(50000-ti*12000)-i*2500;net=gross*.72
              rows.append({'rep_key':f'{team}-{i}','rep_name':f'{team} Rep {i+1}','team':team,'issued_leads':issued,'pitched_leads':issued-1,'pitched_rate':(issued-1)/issued*100,'sold_leads':sold,'close_rate':sold/issued*100,'gross_split':gross,'pending_split':gross-net,'net_split':net,'dpl':net/issued,'sales_retention':72,'avg_gross_sale':gross/max(sold,1),'avg_net_sale':net/max(sold,1)})
          replace_reps(rows); ids={t['name']:int(t['team_id']) for t in get_team_definitions()}
          for row in rows: assign_rep_to_team(row['rep_key'],ids[row['team']])
          s=get_settings();s['active_mode']='whole_office';s['per_team_selected']='UNDISPUTED';s['team_vs_team_selected']=['UNDISPUTED','Bravo'];s['display_refresh_seconds']=2
          metrics=['rank','rep_name','team','issued_leads','pitched_leads','pitched_rate','sold_leads','close_rate','gross_split','pending_split','net_split','dpl','sales_retention','avg_gross_sale','avg_net_sale']
          for mode in s['visible_metrics']:s['visible_metrics'][mode]=metrics;s['sort_metric'][mode]='gross_split'
          save_settings(s)
          PY
          python app/server.py >/tmp/v72.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8765/health && exit 0; sleep .5; done
          cat /tmp/v72.log; exit 1
      - name: Verify true 4K rendering
        run: |
          cat > verify-v72.js <<'JS'
          const {chromium}=require('playwright');
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          const sleep=t=>new Promise(r=>setTimeout(r,t));
          async function visible(page,sel){return await page.locator(sel).count()>0 && await page.locator(sel).first().isVisible().catch(()=>false)}
          (async()=>{
            const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:3840,height:2160}});const errors=[];p.on('pageerror',e=>errors.push(String(e)));
            await p.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});await p.waitForSelector('#v55OfficeBroadcast .v55-office-row');await sleep(200);
            let x=await p.evaluate(()=>{const r=document.querySelector('#v55OfficeBroadcast'),m=r.querySelector('.v55-office-main'),row=r.querySelector('.v55-office-row:not(.champion)')||r.querySelector('.v55-office-row'),n=r.querySelector('.v55-office-name'),s=r.querySelector('.v55-office-stat'),bg=r.querySelector('.v55-office-bg'),hero=r.querySelector('.v55-office-hero');return {w:m.getBoundingClientRect().width,h:row.getBoundingClientRect().height,n:parseFloat(getComputedStyle(n).fontSize),s:parseFloat(getComputedStyle(s).fontSize),p:parseFloat(getComputedStyle(s).paddingLeft),bz:+getComputedStyle(bg).zIndex,hz:+getComputedStyle(hero).zIndex}});
            assert(x.w>3500,`office width ${JSON.stringify(x)}`);assert(x.h>=38&&x.h<=82,'office row bound');assert(x.n>=14&&x.s>=10.5,'office text');assert(x.p<=1.1,'office padding');assert(x.hz>x.bz,'office background layer');
            await p.keyboard.press('ArrowRight');await p.waitForSelector('.v69-team-card .v69-row');await sleep(250);
            const cards=await p.evaluate(()=>[...document.querySelectorAll('.v69-team-card')].map(c=>{const rows=c.querySelector('.v69-rows'),all=[...c.querySelectorAll('.v69-row')],f=c.querySelector('.v69-footer'),last=all.at(-1),s=c.querySelector('.v69-stat'),bg=c.querySelector('.v69-card-bg'),hero=c.querySelector('.v69-hero');return {inside:f?.parentElement===rows,gap:f&&last?Math.abs(f.getBoundingClientRect().top-last.getBoundingClientRect().bottom):999,font:parseFloat(getComputedStyle(s).fontSize),bz:bg?+getComputedStyle(bg).zIndex:0,hz:hero?+getComputedStyle(hero).zIndex:2}}));
            assert(cards.length===2,'comparison count');cards.forEach(c=>{assert(c.inside,'comparison totals parent');assert(c.gap<8,`comparison totals gap ${c.gap}`);assert(c.font>=10,'comparison font');assert(c.hz>c.bz,'comparison background layer')});
            for(let i=0;i<5&&!await visible(p,'#themedTeamBroadcast .bt-row');i++){await p.keyboard.press('ArrowRight');await sleep(650)}
            assert(await visible(p,'#themedTeamBroadcast .bt-row'),'did not reach per-team view');
            x=await p.evaluate(()=>{const r=document.querySelector('#themedTeamBroadcast'),m=r.querySelector('.bt-main'),row=r.querySelector('.bt-row:not(.champion)')||r.querySelector('.bt-row'),n=r.querySelector('.bt-name'),s=r.querySelector('.bt-stat'),f=r.querySelector('.bt-footer'),last=[...r.querySelectorAll('.bt-row')].at(-1),bg=r.querySelector('.bt-bg'),hero=r.querySelector('.bt-hero');return {w:m.getBoundingClientRect().width,h:row.getBoundingClientRect().height,n:parseFloat(getComputedStyle(n).fontSize),s:parseFloat(getComputedStyle(s).fontSize),gap:f&&last?Math.abs(f.getBoundingClientRect().top-last.getBoundingClientRect().bottom):999,bz:bg?+getComputedStyle(bg).zIndex:0,hz:hero?+getComputedStyle(hero).zIndex:2}});
            assert(x.w>3500,`team width ${JSON.stringify(x)}`);assert(x.h>=44&&x.h<=82,'team row bound');assert(x.n>=14&&x.s>=11,'team text');assert(x.gap<12,`team totals gap ${x.gap}`);assert(x.hz>x.bz,'team background layer');assert(!errors.length,errors.join(' | '));
            console.log('v72 3840x2160 passed',x,cards);await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify-v72.js
      - name: Boundary and commit
        run: |
          bad=$(git diff --name-only | grep -E '^(app/server.py|app/database.py|app/sources/)' || true); test -z "$bad"
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION app/static/theme-studio.js app/static/table-readability-v72.js app/templates/display.html app/templates/settings.html
          git diff --cached --quiet || git commit -m 'v72: readable 4K tables, fit-only preview, table-bound totals [generated]'
          git push origin HEAD:build/v72-readable-tables-no-preview-zoom
