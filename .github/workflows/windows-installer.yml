name: Stats Windows production installer

on:
  pull_request:
    branches:
      - production
    paths:
      - "app/**"
      - "windows/**"
      - "requirements.txt"
      - "VERSION"
      - "scripts/sign_release_manifest.py"
      - "scripts/verify_release_manifest.py"
      - ".github/workflows/windows-installer.yml"
  push:
    branches:
      - production
    paths:
      - "app/**"
      - "windows/**"
      - "requirements.txt"
      - "VERSION"
      - "scripts/sign_release_manifest.py"
      - "scripts/verify_release_manifest.py"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested build as the public signed release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PUBLIC_UPDATE_REPO: matijepekovic/pi-sales-leaderboard-updates

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Reject retired product name
        shell: pwsh
        run: |
          $forbidden = -join (84,97,98,108,111 | ForEach-Object { [char]$_ })
          $hits = git grep -n -I -- $forbidden
          $grepExit = $LASTEXITCODE
          if ($grepExit -eq 0) {
            Write-Host $hits
            throw "Retired product name is still present in tracked production files"
          }
          if ($grepExit -ne 1) {
            throw "Could not complete product-name scan"
          }
          exit 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.15.0

      - name: Read production version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Production VERSION must be MAJOR.MINOR.PATCH"
          }
          "STATS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test restructured runtime ownership
        shell: pwsh
        run: python windows/test_restructured_runtime.py

      - name: Test PIN authentication
        shell: pwsh
        run: python windows/test_auth.py

      - name: Test persistent data paths
        shell: pwsh
        run: python windows/test_paths.py

      - name: Test storage boundaries
        shell: pwsh
        run: python windows/test_storage_boundaries.py

      - name: Test launcher close behavior
        shell: pwsh
        run: python windows/test_launcher.py

      - name: Test signed update verification
        shell: pwsh
        run: python windows/test_windows_update.py

      - name: Test display runtime ordering
        shell: pwsh
        run: python windows/test_display_runtime.py

      - name: Test screen controller
        shell: pwsh
        run: python windows/test_screen_controller.py

      - name: Test updater diagnostics
        shell: pwsh
        run: python windows/test_windows_update_diagnostics.py

      - name: Test repository persistence
        shell: pwsh
        run: python windows/test_repository_persistence.py

      - name: Test Tableau source contracts
        shell: pwsh
        run: python windows/test_tableau_source.py

      - name: Build packaged backend
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --noconsole `
            --name StatsServer `
            --paths app `
            --add-data "app/templates;templates" `
            --add-data "app/static;static" `
            --add-data "VERSION;." `
            --hidden-import stats_core.windows.update `
            --hidden-import stats_core.windows.update_status `
            --hidden-import stats_core.windows.update_diagnostics `
            --hidden-import stats_core.windows.tableau_login `
            --hidden-import stats_core.windows.theme_editor `
            --hidden-import stats_core.windows.https `
            --hidden-import cryptography.hazmat.primitives.asymmetric.ed25519 `
            windows/server_entry.py

      - name: Build Windows fullscreen launcher
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --noconsole `
            --name StatsLauncher `
            --paths app `
            windows/launcher.py

      - name: Build detached update helper
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --noconsole `
            --name StatsUpdater `
            windows/updater.py
          .\dist\StatsUpdater.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "StatsUpdater self-test failed"
          }

      - name: Smoke-test packaged backend and signed update feed
        shell: pwsh
        run: |
          $server = Resolve-Path ".\dist\StatsServer\StatsServer.exe"
          $process = Start-Process -FilePath $server -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) {
                throw "Packaged backend exited early with code $($process.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 2
                if ($health.ok -eq $true) {
                  $healthy = $true
                  break
                }
              } catch {}
            }
            if (-not $healthy) {
              throw "Packaged backend did not become healthy"
            }

            $version = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/system/version" -TimeoutSec 5
            if ($version.version -ne $env:STATS_VERSION) {
              throw "Packaged backend version mismatch: $($version.version)"
            }

            $display = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 5
            if ($display.StatusCode -ne 200) {
              throw "Leaderboard display did not render"
            }

            $update = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/windows/update/check" -Method Post -TimeoutSec 30
            if ($update.ok -ne $true -or $update.latest -notmatch '^\d+\.\d+\.\d+$') {
              throw "Packaged backend could not verify the signed public update feed"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "windows\Stats.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed"
          }

      - name: Verify install and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem ".\installer-output\Stats-Setup-*-windows-x64.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer executable was not produced"
          }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="startup"' -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "Silent installer test failed with code $($install.ExitCode)"
          }

          $installedRoot = Join-Path $env:LOCALAPPDATA "Programs\Stats"
          if (-not (Test-Path (Join-Path $installedRoot "StatsLauncher.exe"))) {
            throw "Installed launcher is missing"
          }
          if (-not (Test-Path (Join-Path $installedRoot "StatsUpdater.exe"))) {
            throw "Installed updater helper is missing"
          }
          if (-not (Test-Path (Join-Path $installedRoot "server\StatsServer.exe"))) {
            throw "Installed backend is missing"
          }

          $startupLink = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Startup\Stats.lnk"
          if (-not (Test-Path $startupLink)) {
            throw "Startup shortcut was not installed"
          }

          $serverProcess = Start-Process -FilePath (Join-Path $installedRoot "server\StatsServer.exe") -PassThru
          Start-Sleep -Seconds 3
          if ($serverProcess.HasExited) {
            throw "Installed backend exited before uninstall test"
          }

          $uninstaller = Get-ChildItem $installedRoot -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) {
            throw "Uninstaller executable is missing"
          }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent uninstall failed with code $($uninstall.ExitCode)"
          }

          Start-Sleep -Seconds 2
          $serverProcess.Refresh()
          if (-not $serverProcess.HasExited) {
            Stop-Process -Id $serverProcess.Id -Force -ErrorAction SilentlyContinue
            throw "Uninstaller did not stop the running backend"
          }
          if (Test-Path $installedRoot) {
            throw "Program directory remains after uninstall"
          }
          if (Test-Path $startupLink) {
            throw "Startup shortcut remains after uninstall"
          }

      - name: Sign and verify public release manifest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PRIVATE_KEY)) {
            throw "UPDATE_SIGNING_PRIVATE_KEY is not configured"
          }
          $installer = Get-ChildItem ".\installer-output\Stats-Setup-*-windows-x64.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Tested Windows installer is missing"
          }
          python scripts/sign_release_manifest.py `
            --version "$env:STATS_VERSION" `
            --output-dir installer-output `
            "$($installer.FullName)"
          if ($LASTEXITCODE -ne 0) {
            throw "Release manifest signing failed"
          }
          python scripts/verify_release_manifest.py `
            --manifest installer-output/release-manifest.json `
            --signature installer-output/release-manifest.json.sig `
            --asset-dir installer-output
          if ($LASTEXITCODE -ne 0) {
            throw "Signed release verification failed"
          }

      - name: Publish signed public Windows release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATE_PUBLISH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "UPDATE_PUBLISH_TOKEN is not configured"
          }

          $tag = "v$env:STATS_VERSION"
          $installer = Get-ChildItem ".\installer-output\Stats-Setup-*-windows-x64.exe" | Select-Object -First 1
          $manifest = Resolve-Path ".\installer-output\release-manifest.json"
          $signature = Resolve-Path ".\installer-output\release-manifest.json.sig"

          gh release view $tag --repo $env:PUBLIC_UPDATE_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            $existing = Join-Path $env:RUNNER_TEMP "existing-public-release"
            New-Item -ItemType Directory -Force -Path $existing | Out-Null
            gh release download $tag --repo $env:PUBLIC_UPDATE_REPO --dir $existing
            if ($LASTEXITCODE -ne 0) {
              throw "Could not verify existing public release $tag"
            }

            $remoteInstaller = Get-ChildItem $existing -Filter $installer.Name | Select-Object -First 1
            $remoteManifest = Join-Path $existing "release-manifest.json"
            $remoteSignature = Join-Path $existing "release-manifest.json.sig"
            if (-not $remoteInstaller -or -not (Test-Path $remoteManifest) -or -not (Test-Path $remoteSignature)) {
              throw "Public release $tag already exists but is incomplete"
            }

            $pairs = @(
              @($installer.FullName, $remoteInstaller.FullName),
              @($manifest.Path, $remoteManifest),
              @($signature.Path, $remoteSignature)
            )
            foreach ($pair in $pairs) {
              $localHash = (Get-FileHash -Algorithm SHA256 $pair[0]).Hash
              $remoteHash = (Get-FileHash -Algorithm SHA256 $pair[1]).Hash
              if ($localHash -ne $remoteHash) {
                throw "Public release $tag already exists with different assets"
              }
            }
            Write-Host "Public release $tag already exists with identical signed assets."
            exit 0
          }

          $notes = @"
          Official Stats production release $env:STATS_VERSION.

          Windows x64 installer included. Stats verifies the Ed25519-signed manifest and SHA-256 before any in-app update is installed. Customer machines do not receive GitHub credentials or the private signing key.
          "@

          gh release create $tag `
            "$($installer.FullName)" `
            "$($manifest.Path)" `
            "$($signature.Path)" `
            --repo $env:PUBLIC_UPDATE_REPO `
            --title "Stats $env:STATS_VERSION" `
            --notes $notes
          if ($LASTEXITCODE -ne 0) {
            throw "Public release publication failed"
          }

      - name: Upload tested installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stats-Windows-${{ env.STATS_VERSION }}-${{ github.sha }}
          path: installer-output/Stats-Setup-*-windows-x64.exe
          if-no-files-found: error
          retention-days: 14
