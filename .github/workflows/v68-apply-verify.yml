name: v68 apply and verify
permissions:
  contents: write
on:
  push:
    branches: [build/v68-pinch-cap]
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[v68 generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v68 source changes
        run: |
          python <<'PY'
          from pathlib import Path

          p=Path('app/static/theme-studio.js')
          s=p.read_text()
          s=s.replace('const MIN_SIZE=50,MAX_SIZE=250,MAX_CROP=60;', 'const MIN_SIZE=50,MAX_SIZE=600,MAX_CROP=60;\n  const MIN_ZOOM=1,MAX_ZOOM=4,MIN_PINCH_DIST=4;')

          old='''  function clampPan(){
    const stage=byId("tdStage");
    if(!stage)return;
    const fit=fitScale();
    const w=geometry.width*fit*zoomFactor, h=geometry.height*fit*zoomFactor;
    const maxX=Math.max(0,w-stage.clientWidth), maxY=Math.max(0,h-stage.clientHeight);
    panX=clamp(panX,-maxX,0);
    panY=clamp(panY,-maxY,0);
  }

  function setZoom(next,originX,originY){
    const before=zoomFactor;
    zoomFactor=clamp(next,1,6);
    if(originX!==undefined){
      // Zoom about the point under the fingers rather than the top-left.
      const ratio=zoomFactor/before;
      panX=originX-(originX-panX)*ratio;
      panY=originY-(originY-panY)*ratio;
    }
    if(zoomFactor===1){panX=0;panY=0;}
    layoutPreview();
  }
'''
          new='''  function clampPan(){
    const stage=byId("tdStage");
    if(!stage)return;
    // Never let one malformed gesture poison every later transform.
    if(!Number.isFinite(zoomFactor)||zoomFactor<MIN_ZOOM||zoomFactor>MAX_ZOOM)zoomFactor=MIN_ZOOM;
    if(!Number.isFinite(panX))panX=0;
    if(!Number.isFinite(panY))panY=0;
    const fit=fitScale();
    if(!Number.isFinite(fit)||fit<=0){panX=0;panY=0;return;}
    const w=geometry.width*fit*zoomFactor, h=geometry.height*fit*zoomFactor;
    const maxX=Math.max(0,Number.isFinite(w)?w-stage.clientWidth:0);
    const maxY=Math.max(0,Number.isFinite(h)?h-stage.clientHeight:0);
    panX=clamp(panX,-maxX,0);
    panY=clamp(panY,-maxY,0);
  }

  function setZoom(next,originX,originY){
    const before=Number.isFinite(zoomFactor)&&zoomFactor>=MIN_ZOOM&&zoomFactor<=MAX_ZOOM
      ?zoomFactor:MIN_ZOOM;
    const candidate=Number(next);
    // Keep the last known-good zoom when a browser reports a degenerate pinch.
    zoomFactor=Number.isFinite(candidate)?clamp(candidate,MIN_ZOOM,MAX_ZOOM):before;
    if(Number.isFinite(originX)&&Number.isFinite(originY)&&before>0){
      // Zoom about the point under the fingers rather than the top-left.
      const ratio=zoomFactor/before;
      if(Number.isFinite(ratio)){
        panX=originX-(originX-(Number.isFinite(panX)?panX:0))*ratio;
        panY=originY-(originY-(Number.isFinite(panY)?panY:0))*ratio;
      }
    }
    if(!Number.isFinite(panX))panX=0;
    if(!Number.isFinite(panY))panY=0;
    if(zoomFactor===MIN_ZOOM){panX=0;panY=0;}
    layoutPreview();
  }
'''
          if old not in s: raise SystemExit('gesture zoom block not found')
          s=s.replace(old,new)

          old='''    stage.addEventListener("pointerdown",e=>{
      stage.setPointerCapture(e.pointerId);
      points.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(points.size===2){
        const p=[...points.values()];
        startDist=dist(p);startZoom=zoomFactor;startMid=mid(p);
        panning=false;
      }else if(points.size===1){
'''
          new='''    stage.addEventListener("pointerdown",e=>{
      // iOS/Chromium can release a touch before this handler asks for capture.
      // Pointer capture is an optimisation here, never a reason to kill preview.
      try{stage.setPointerCapture(e.pointerId);}catch(_e){}
      if(!Number.isFinite(e.clientX)||!Number.isFinite(e.clientY))return;
      points.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(points.size===2){
        const p=[...points.values()];
        const measured=dist(p);
        startDist=Number.isFinite(measured)&&measured>=MIN_PINCH_DIST?measured:0;
        startZoom=Number.isFinite(zoomFactor)?zoomFactor:MIN_ZOOM;
        startMid=startDist?mid(p):null;
        if(startMid&&(!Number.isFinite(startMid.x)||!Number.isFinite(startMid.y))){startDist=0;startMid=null;}
        panning=false;
      }else if(points.size===1){
'''
          if old not in s: raise SystemExit('pointerdown block not found')
          s=s.replace(old,new)

          old='''    stage.addEventListener("pointermove",e=>{
      if(!points.has(e.pointerId))return;
      points.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(points.size>=2&&startDist){
        const p=[...points.values()].slice(0,2);
        setZoom(startZoom*(dist(p)/startDist),startMid.x,startMid.y);
      }else if(panning){
        panX+=e.clientX-lastX;panY+=e.clientY-lastY;
        lastX=e.clientX;lastY=e.clientY;
        layoutPreview();
      }
    });
'''
          new='''    stage.addEventListener("pointermove",e=>{
      if(!points.has(e.pointerId))return;
      if(!Number.isFinite(e.clientX)||!Number.isFinite(e.clientY))return;
      points.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(points.size>=2&&startDist>=MIN_PINCH_DIST&&startMid){
        const p=[...points.values()].slice(0,2);
        const measured=dist(p);
        if(Number.isFinite(measured)&&measured>=MIN_PINCH_DIST){
          setZoom(startZoom*(measured/startDist),startMid.x,startMid.y);
        }
      }else if(panning){
        const dx=e.clientX-lastX,dy=e.clientY-lastY;
        if(Number.isFinite(dx)&&Number.isFinite(dy)){panX+=dx;panY+=dy;}
        lastX=e.clientX;lastY=e.clientY;
        layoutPreview();
      }
    });
'''
          if old not in s: raise SystemExit('pointermove block not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('app/themes.py')
          s=p.read_text()
          s=s.replace('"size": _bounded_number(raw.get("size"), 100, 50, 250),','"size": _bounded_number(raw.get("size"), 100, 50, 600),')
          s=s.replace('"size": {"min": 50, "max": 250, "step": 5, "default": 100},','"size": {"min": 50, "max": 600, "step": 5, "default": 100},')
          p.write_text(s)

          p=Path('app/templates/settings.html')
          s=p.read_text().replace('/static/theme-studio.js?v=67','/static/theme-studio.js?v=68')
          p.write_text(s)
          Path('VERSION').write_text('68\n')
          PY
      - name: Static validation
        run: |
          node --check app/static/theme-studio.js
          python -m py_compile app/themes.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'app')
          import themes
          assert themes._clean_corner_settings({'corner_tl':{'size':500}})['corner_tl']['size']==500
          assert themes._clean_corner_settings({'corner_tl':{'size':900}})['corner_tl']['size']==600
          assert themes._manifest()['corner_controls']['size']['max']==600
          print('corner cap server checks passed')
          PY
          grep -q 'MAX_SIZE=600' app/static/theme-studio.js
          grep -q 'MAX_ZOOM=4' app/static/theme-studio.js
          grep -q 'try{stage.setPointerCapture' app/static/theme-studio.js
          grep -q 'theme-studio.js?v=68' app/templates/settings.html
          test "$(cat VERSION)" = 68
      - name: Install browser test dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start real app
        env:
          HOME: ${{ runner.temp }}/pi-home
        run: |
          mkdir -p "$HOME"
          python app/server.py > /tmp/pi-app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8765/health && exit 0
            sleep .5
          done
          cat /tmp/pi-app.log
          exit 1
      - name: Stress preview gestures
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/settings',{waitUntil:'networkidle'});
            await page.evaluate(()=>window.openTeamDesign(1));
            await page.locator('#tdConfirmOk').click();
            const stage=page.locator('#tdStage');await stage.waitFor({state:'visible'});

            // The exact stale-pointer event that throws in v67 must be harmless.
            await stage.dispatchEvent('pointerdown',{pointerId:77,pointerType:'touch',isPrimary:true,clientX:140,clientY:260,buttons:1});
            await stage.dispatchEvent('pointerup',{pointerId:77,pointerType:'touch',isPrimary:true,clientX:140,clientY:260,buttons:0});

            const cdp=await page.context().newCDPSession(page);
            const box=await stage.boundingBox();
            const x=box.x+box.width/2,y=box.y+box.height/2;
            const touch=(type,pts)=>cdp.send('Input.dispatchTouchEvent',{type,touchPoints:pts.map(([px,py])=>({x:px,y:py,radiusX:5,radiusY:5,force:1,id:pts.indexOf([px,py])}))});
            async function finite(){
              const t=await page.locator('#tdSizer').evaluate(el=>getComputedStyle(el).transform||el.style.transform||'');
              if(/NaN|Infinity/.test(t))throw new Error('non-finite preview transform: '+t);
              const nums=(t.match(/-?\d+(?:\.\d+)?(?:e[+-]?\d+)?/gi)||[]).map(Number);
              if(nums.some(n=>!Number.isFinite(n)))throw new Error('invalid transform: '+t);
            }

            // Degenerate pinch: both contacts start at the same pixel.
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y,id:1},{x,y,id:2}]});
            await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:x-30,y,id:1},{x:x+30,y,id:2}]});
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            await finite();

            // Repeated normal pinches exercise capture, zoom limits and cleanup.
            for(let i=0;i<50;i++){
              await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:x-24,y,id:1},{x:x+24,y,id:2}]});
              await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:x-45,y,id:1},{x:x+45,y,id:2}]});
              await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
              await finite();
            }

            // Still responsive afterwards: wheel zoom, pan, then fit.
            await stage.dispatchEvent('wheel',{deltaY:-100,ctrlKey:true,clientX:x,clientY:y});
            await stage.dispatchEvent('pointerdown',{pointerId:88,pointerType:'mouse',clientX:x,clientY:y,buttons:1});
            await stage.dispatchEvent('pointermove',{pointerId:88,pointerType:'mouse',clientX:x-20,clientY:y-10,buttons:1});
            await stage.dispatchEvent('pointerup',{pointerId:88,pointerType:'mouse',clientX:x-20,clientY:y-10,buttons:0});
            await stage.dispatchEvent('dblclick',{clientX:x,clientY:y});
            await finite();
            if(errors.length)throw new Error('page errors: '+errors.join(' | '));
            console.log('v68 gesture stress passed');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit generated v68
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app/static/theme-studio.js app/themes.py app/templates/settings.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v68: fix preview pinch crash and raise corner cap [v68 generated]"
          git push origin HEAD:build/v68-pinch-cap
