name: v46 TL Display Smoke
on:
  push:
    branches: [build/tl-display-v46]
    paths:
      - app/static/team-lead-display.js
      - app/static/themed-team-layout.js
      - app/static/asset-library/catalog.json
      - app/templates/display.html
      - VERSION
      - .github/workflows/v46-tl-display-smoke.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/tl-display-v46
          fetch-depth: 0
      - name: JavaScript syntax
        run: |
          node --check app/static/team-lead-display.js
          node --check app/static/themed-team-layout.js
      - name: Catalog and integration
        run: |
          python -m json.tool app/static/asset-library/catalog.json >/dev/null
          grep -q '"label": "TL"' app/static/asset-library/catalog.json
          grep -q 'team-lead-display.js?v=46' app/templates/display.html
          grep -q 'themed-team-layout.js?v=46' app/templates/display.html
          grep -q 'bt-footer-spacer' app/static/themed-team-layout.js
          grep -q 'bt-tl-mark' app/static/themed-team-layout.js
          test "$(tr -d '\n' < VERSION)" = "46"
      - name: Verify display-only diff
        run: |
          git fetch origin main
          CHANGED="$(git diff --name-only origin/main...HEAD | grep -v '^.github/workflows/v46-tl-display-smoke.yml$')"
          printf '%s\n' "$CHANGED"
          test -z "$(printf '%s\n' "$CHANGED" | grep -E '^(app/server.py|app/database.py|app/sources/|app/data_|app/templates/settings|app/themes.py)' || true)"
