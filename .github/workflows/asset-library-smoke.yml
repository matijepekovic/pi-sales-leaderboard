name: Asset Library Smoke Test

on:
  push:
    branches:
      - build/asset-library-v44
    paths:
      - .github/workflows/asset-library-smoke.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/asset-library-v44
      - name: Validate JavaScript
        run: node --check app/static/asset-library.js
      - name: Validate catalog JSON
        run: python -m json.tool app/static/asset-library/catalog.json >/dev/null
      - name: Validate catalog source assets
        run: |
          test -s app/static/theme-packs/undisputed/champ.jpg
          test -s app/static/theme-packs/undisputed/row.jpg
          test -s app/static/theme-packs/undisputed/medallion.png
          test -s app/static/theme-packs/undisputed/totmark.png
          test -s app/static/theme-packs/undisputed/ctl.png
          test -s app/static/theme-packs/undisputed/ctr.png
          test -s app/static/theme-packs/undisputed/cbl.png
          test -s app/static/theme-packs/undisputed/cbr.png
      - name: Validate settings integration
        run: grep -q 'asset-library.js?v=44' app/templates/settings.html
      - name: Validate version
        run: test "$(tr -d '\n' < VERSION)" = "44"
