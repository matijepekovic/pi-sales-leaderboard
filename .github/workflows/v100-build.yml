name: v100 real Tableau filters
permissions:
  contents: write
on:
  push:
    branches: [build/v100-tableau-real-filters]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v100
        run: |
          python - <<'PY'
          from pathlib import Path

          # source_picker.py: report-driven filter catalog + correct active export label.
          p=Path('app/source_picker.py')
          s=p.read_text()
          old='''        "mapping": config["mapping"],\n        "defaults": DEFAULTS,\n'''
          new='''        "mapping": config["mapping"],\n        "export": config["export"],\n        "defaults": DEFAULTS,\n'''
          if old not in s: raise SystemExit('describe anchor changed')
          s=s.replace(old,new,1)

          anchor='''\ndef read_columns(settings, overrides=None):\n'''
          if anchor not in s: raise SystemExit('read_columns anchor changed')
          helper=r'''\n\n_FILTER_VALUE_LIMIT = 1000\n_FILTER_ROW_LIMIT = 5000\n\n\ndef _filter_text(value):\n    if value is None:\n        return ""\n    if isinstance(value, bool):\n        return "True" if value else "False"\n    if isinstance(value, float) and value.is_integer():\n        return str(int(value))\n    return str(value).strip()\n\n\ndef report_filter_catalog(payload, how):\n    """Fields and actual values from the selected report export.\n\n    Tableau REST accepts vf_<field>=<value> using workbook field captions.\n    Instead of asking the user to type those captions, expose the exact fields\n    and values that this report really returned. No KPI is calculated here.\n    """\n    if how == "crosstab":\n        described = describe_crosstab(payload)\n        headers = list(described.get("headers") or [])\n        rows = list(described.get("rows") or [])[:_FILTER_ROW_LIMIT]\n    else:\n        reader = _base.csv.DictReader(_base.io.StringIO(str(payload or "")))\n        headers = [str(h or "").strip() for h in (reader.fieldnames or [])\n                   if str(h or "").strip()]\n        rows = []\n        for index, row in enumerate(reader):\n            if index >= _FILTER_ROW_LIMIT:\n                break\n            rows.append(row)\n\n    catalog = []\n    for header in headers:\n        values, seen = [], set()\n        truncated = False\n        for row in rows:\n            text = _filter_text(row.get(header))\n            if not text or text.casefold() == "all":\n                continue\n            key = text.casefold()\n            if key in seen:\n                continue\n            seen.add(key)\n            if len(values) < _FILTER_VALUE_LIMIT:\n                values.append(text)\n            else:\n                truncated = True\n        values.sort(key=lambda value: value.casefold())\n        catalog.append({\n            "field": header,\n            "values": values,\n            "truncated": truncated,\n        })\n    return catalog\n'''
          s=s.replace(anchor,helper+anchor,1)

          old='''    config = trial_config(settings, overrides)\n    trial = trial_settings(settings, overrides)\n    source = ConfiguredTableauSource(trial, config)\n'''
          new='''    config = trial_config(settings, overrides)\n    trial = trial_settings(settings, overrides)\n    # Discovery must not be narrowed by filters saved for an older report.\n    # Read the selected report itself, then let the user choose filters from\n    # the fields and values it actually returned. Preview/scheduled pulls still\n    # use the saved filters normally.\n    discovery = dict(config)\n    discovery["filters"] = []\n    discovery["row_filter"] = {}\n    source = ConfiguredTableauSource(trial, discovery)\n'''
          # only replace the occurrence inside read_columns, not preview_pull.
          idx=s.index('def read_columns(settings, overrides=None):')
          tail=s[idx:]
          if old not in tail: raise SystemExit('read_columns source anchor changed')
          tail=tail.replace(old,new,1)
          s=s[:idx]+tail

          old='''    return {**described, "start": start, "end": end}\n'''
          new='''    return {\n        **described,\n        "start": start,\n        "end": end,\n        "filter_fields": report_filter_catalog(payload, how),\n    }\n'''
          if old not in s: raise SystemExit('read_columns return anchor changed')
          s=s.replace(old,new,1)
          p.write_text(s)

          # data-source-v90.js: replace free-text/hardcoded filters with report fields.
          p=Path('app/static/data-source-v90.js')
          s=p.read_text()
          old='''        <h3 style="margin:15px 0 6px">Tableau filters</h3>\n        <div id="v90Filters"></div>\n        <button id="v90AddFilter" class="btn" type="button" style="margin-top:6px">Add Filter</button>\n\n        <h3 style="margin:15px 0 6px">Keep only</h3>\n        <div class="grid">\n          <div><label for="v90KeepColumn">Column</label><select id="v90KeepColumn"></select></div>\n          <div><label for="v90KeepValue">Value</label><input id="v90KeepValue" type="text" placeholder="Optional"></div>\n        </div>\n'''
          new='''        <h3 style="margin:15px 0 6px">Report Filters</h3>\n        <div id="v90Filters"></div>\n        <button id="v90AddFilter" class="btn" type="button" style="margin-top:6px" disabled>Add Filter</button>\n'''
          if old not in s: raise SystemExit('filter card anchor changed')
          s=s.replace(old,new,1)

          s=s.replace('let filters=[], defaults={};','let filters=[], filterFields=[], defaults={};',1)
          old='''      row_filter:{column:$("v90KeepColumn").value,value:$("v90KeepValue").value.trim()},\n'''
          if old not in s: raise SystemExit('candidate row filter anchor changed')
          s=s.replace(old,'      row_filter:{},\n',1)

          start=s.index('  function paintFilters(){')
          end=s.index('\n\n  function options(', start)
          replacement=r'''  function filterFieldOptions(selected){\n    const fields=filterFields.map(f=>String(f.field||"")).filter(Boolean);\n    if(selected&&!fields.includes(selected)) fields.unshift(selected);\n    return '<option value="">Choose field…</option>'+fields.map(field=>\n      `<option value="${esc(field)}"${field===selected?" selected":""}>${esc(field)}</option>`\n    ).join("");\n  }\n\n  function filterValueControl(filter,index){\n    const entry=filterFields.find(item=>item.field===filter.field);\n    const values=(entry?.values||[]).map(value=>String(value));\n    const current=String(filter.value||"");\n    if(values.length&&!entry?.truncated){\n      const known=values.slice();\n      if(current&&!known.includes(current)) known.unshift(current);\n      return `<select class="v100FValue" data-i="${index}" style="flex:1 1 auto">`+\n        '<option value="">Choose value…</option>'+known.map(value=>\n          `<option value="${esc(value)}"${value===current?" selected":""}>${esc(value)}</option>`\n        ).join("")+`</select>`;\n    }\n    const placeholder=filter.field?(entry?.truncated?"Type exact value":"No values returned"):"Choose field first";\n    return `<input class="v100FValue" data-i="${index}" type="text" value="${esc(current)}" `+\n      `placeholder="${esc(placeholder)}" style="flex:1 1 auto">`;\n  }\n\n  function paintFilters(){\n    const add=$("v90AddFilter");\n    if(add) add.disabled=!filterFields.length;\n    if(!filterFields.length){\n      const saved=filters.filter(f=>f.field).map(f=>`${f.field}${f.value?` = ${f.value}`:""}`).join(" · ");\n      $("v90Filters").innerHTML=`<div class="small">${saved?`Saved: ${esc(saved)} · `:""}Read Report to load filters.</div>`;\n      return;\n    }\n\n    // A field absent from the selected report is stale configuration from a\n    // different report. Do not silently send it to Tableau.\n    filters=filters.filter(f=>filterFields.some(item=>item.field===f.field));\n    $("v90Filters").innerHTML=filters.map((f,i)=>`\n      <div class="row" style="gap:8px;align-items:center;margin-bottom:8px">\n        <select class="v100FField" data-i="${i}" style="flex:1 1 auto">${filterFieldOptions(f.field)}</select>\n        ${filterValueControl(f,i)}\n        <button class="btn danger v100FDrop" data-i="${i}" type="button">Remove</button>\n      </div>`).join("") || '<div class="small">No filters.</div>';\n\n    $("v90Filters").querySelectorAll(".v100FField").forEach(el=>\n      el.addEventListener("change",()=>{\n        const i=Number(el.dataset.i);\n        filters[i].field=el.value; filters[i].value=""; paintFilters(); touched();\n      }));\n    $("v90Filters").querySelectorAll(".v100FValue").forEach(el=>{\n      const sync=()=>{filters[Number(el.dataset.i)].value=el.value;touched();};\n      el.addEventListener("change",sync);\n      if(el.tagName==="INPUT") el.addEventListener("input",sync);\n    });\n    $("v90Filters").querySelectorAll(".v100FDrop").forEach(el=>\n      el.addEventListener("click",()=>{filters.splice(Number(el.dataset.i),1);paintFilters();touched();}));\n  }'''
          s=s[:start]+replacement+s[end:]

          old='''    mapping=null; headers=[]; choices=[]; samples={}; paintMapping();\n'''
          new='''    mapping=null; headers=[]; choices=[]; samples={}; filterFields=[]; paintMapping(); paintFilters();\n'''
          # first occurrence is loadColumns.
          if old not in s: raise SystemExit('loadColumns reset anchor changed')
          s=s.replace(old,new,1)

          old='''      headers=d.headers||[]; choices=d.choices||[]; samples=d.samples||{}; shape=d.shape;\n      mapping=d.suggested||{}; mapping.metrics=mapping.metrics||{};\n      paintMapping();\n'''
          new='''      headers=d.headers||[]; choices=d.choices||[]; samples=d.samples||{}; shape=d.shape;\n      filterFields=d.filter_fields||[];\n      mapping=d.suggested||{}; mapping.metrics=mapping.metrics||{};\n      paintMapping(); paintFilters();\n'''
          if old not in s: raise SystemExit('loadColumns success anchor changed')
          s=s.replace(old,new,1)

          old='''    filters=(source.filters||[]).map(f=>({field:f.field||"",value:f.value||""}));\n    paintFilters();\n    const keep=source.row_filter||{};\n    // The columns a keep-only rule may name come from the API: the page's own\n    // metric list is not filled in yet when this card first paints.\n    $("v90KeepColumn").innerHTML='<option value="">— keep every row —</option>'+\n      (columns||[]).map(c=>\n        `<option value="${esc(c.key)}"${c.key===keep.column?" selected":""}>${esc(c.label)}</option>`).join("");\n    $("v90KeepValue").value=keep.value||"";\n'''
          new='''    filterFields=[];\n    filters=(source.filters||[]).map(f=>({field:f.field||"",value:f.value||""}));\n    paintFilters();\n'''
          if old not in s: raise SystemExit('fill filters anchor changed')
          s=s.replace(old,new,1)

          old='''    ["v90Server","v90Site","v90PatName","v90DateStart","v90DateEnd","v90KeepValue"]\n      .forEach(id=>$(id).addEventListener("input",touched));\n    $("v90KeepColumn").addEventListener("change",touched);\n'''
          new='''    ["v90Server","v90Site","v90PatName","v90DateStart","v90DateEnd"]\n      .forEach(id=>$(id).addEventListener("input",touched));\n'''
          if old not in s: raise SystemExit('mount legacy listeners anchor changed')
          s=s.replace(old,new,1)

          old='''      mapping=null; headers=[]; choices=[]; samples={}; paintMapping(); touched();\n'''
          new='''      mapping=null; headers=[]; choices=[]; samples={}; filterFields=[]; filters=[]; paintMapping(); paintFilters(); touched();\n'''
          if old not in s: raise SystemExit('export reset anchor changed')
          s=s.replace(old,new,1)

          old='''    $("v90AddFilter").addEventListener("click",()=>{\n      filters.push({field:"",value:""}); paintFilters(); touched();\n    });\n    $("v79Workbook").addEventListener("change",()=>{touched();loadViews();});\n'''
          new='''    $("v90AddFilter").addEventListener("click",()=>{\n      if(!filterFields.length) return;\n      const used=new Set(filters.map(f=>f.field));\n      const next=filterFields.find(item=>!used.has(item.field))||filterFields[0];\n      filters.push({field:next?.field||"",value:""}); paintFilters(); touched();\n    });\n    $("v79Workbook").addEventListener("change",()=>{\n      filterFields=[]; filters=[]; paintFilters(); touched(); loadViews();\n    });\n'''
          if old not in s: raise SystemExit('add/workbook filter anchor changed')
          s=s.replace(old,new,1)

          old='''    $("v79Sheet").addEventListener("change",()=>{\n      mapping=null; headers=[]; choices=[]; samples={}; paintMapping(); touched();\n'''
          new='''    $("v79Sheet").addEventListener("change",()=>{\n      mapping=null; headers=[]; choices=[]; samples={}; filterFields=[]; filters=[]; paintMapping(); paintFilters(); touched();\n'''
          if old not in s: raise SystemExit('sheet reset anchor changed')
          s=s.replace(old,new,1)

          old='''      touched(); mapping=null; headers=[]; choices=[]; samples={}; paintMapping();\n'''
          new='''      touched(); mapping=null; headers=[]; choices=[]; samples={}; filterFields=[]; filters=[]; paintMapping(); paintFilters();\n'''
          if old not in s: raise SystemExit('reset anchor changed')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Cache-bust and version.
          p=Path('app/templates/settings.html')
          s=p.read_text()
          if '/static/data-source-v90.js?v=99' not in s: raise SystemExit('settings cache anchor changed')
          s=s.replace('/static/data-source-v90.js?v=99','/static/data-source-v90.js?v=100',1)
          p.write_text(s)
          Path('VERSION').write_text('100\n')
          PY
      - name: Syntax and behavior checks
        run: |
          python -m py_compile app/source_picker.py
          node --check app/static/data-source-v90.js
          cd app
          python - <<'PY'
          import source_picker
          sample='Home Branch,SR-Name,Regional Manager,Gross Split\nOlympia,A,West,100\nSeattle,B,West,200\nOlympia,C,North,300\n'
          fields=source_picker.report_filter_catalog(sample,'csv')
          by={item['field']:item for item in fields}
          assert by['Home Branch']['values']==['Olympia','Seattle'], by
          assert by['Regional Manager']['values']==['North','West'], by
          assert by['SR-Name']['values']==['A','B','C'], by
          print('filter catalog ok')
          PY
      - name: UX checks
        run: |
          grep -q 'Report Filters' app/static/data-source-v90.js
          grep -q 'filter_fields' app/source_picker.py
          ! grep -q 'placeholder="Field name"' app/static/data-source-v90.js
          ! grep -q '>Keep only<' app/static/data-source-v90.js
          ! grep -q 'v90KeepColumn' app/static/data-source-v90.js
          ! grep -q 'v90KeepValue' app/static/data-source-v90.js
      - name: Production boundary
        run: |
          git diff --name-only origin/main...HEAD > /tmp/before.txt
          python - <<'PY'
          allowed={'VERSION','app/source_picker.py','app/static/data-source-v90.js','app/templates/settings.html','.github/workflows/v100-build.yml'}
          changed=set(open('/tmp/before.txt').read().splitlines())
          extra=changed-allowed
          if extra: raise SystemExit(f'unexpected files: {sorted(extra)}')
          protected={'app/sources/tableau.py','app/sources/tableau_v36_base.py','app/sources/tableau_crosstab.py','app/sources/tableau_mapped.py','app/tableau_scheduler.py','app/templates/display.html'}
          if changed & protected: raise SystemExit(f'protected files changed: {sorted(changed & protected)}')
          PY
      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION app/source_picker.py app/static/data-source-v90.js app/templates/settings.html
          git diff --cached --quiet && exit 0
          git commit -m 'v100: populate filters from selected Tableau report'
          git push
