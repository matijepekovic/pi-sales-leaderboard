name: v70 keyboard controls build and verify
permissions:
  contents: write
on:
  push:
    branches: [build/v70-keyboard-controls]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v70 source changes
        run: python .github/scripts/apply_v70.py
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Static checks
        run: |
          node --check app/static/keyboard-controls-v70.js
          python -m py_compile app/server.py
          test "$(cat VERSION)" = 70
          grep -q 'keyboard-controls-v70.js?v=70' app/templates/display.html
          grep -q 'keyboardLeaderboardUrl' app/templates/display_v35_base.html
      - name: Prepare isolated Pi data
        env:
          HOME: ${{ runner.temp }}/pi-home
        run: |
          mkdir -p "$HOME"
          python - <<'PY'
          import sys
          sys.path.insert(0,'app')
          from database import init_db, replace_reps, get_team_definitions, assign_rep_to_team, get_settings, save_settings
          init_db()
          rows=[]
          for team,base in [('Alpha',10000),('Bravo',20000),('Charlie',30000)]:
              for i in range(2):
                  issued=5+i
                  sold=1+i
                  gross=base+i*1000
                  net=gross*.75
                  rows.append({
                      'rep_key':f'{team}-{i}', 'rep_name':f'{team} Rep {i+1}', 'team':team,
                      'issued_leads':issued, 'pitched_leads':issued-1, 'sold_leads':sold,
                      'gross_split':gross, 'pending_split':gross-net, 'net_split':net,
                      'close_rate':sold/issued*100, 'dpl':net/issued,
                  })
          replace_reps(rows)
          ids={t['name']:int(t['team_id']) for t in get_team_definitions()}
          for row in rows:
              assign_rep_to_team(row['rep_key'],ids[row['team']])
          settings=get_settings()
          settings['active_mode']='whole_office'
          settings['team_vs_team_selected']=['Alpha','Bravo']
          settings['per_team_selected']='Alpha'
          settings['display_refresh_seconds']=2
          for mode in settings['sort_metric']:
              settings['sort_metric'][mode]='net_split'
          save_settings(settings)
          PY
      - name: Read-only override API contract
        env:
          HOME: ${{ runner.temp }}/pi-home
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'app')
          import server
          from database import get_settings
          client=server.app.test_client()
          before=get_settings()
          r=client.get('/api/leaderboard?mode=team_vs_team&sort_metric=gross_split&team=Alpha&team=Charlie')
          assert r.status_code==200, r.data
          d=r.get_json()
          assert d['mode']=='team_vs_team'
          assert d['sort_metric']=='gross_split'
          assert {t['summary']['team'] for t in d['teams']}=={'Alpha','Charlie'}
          r=client.get('/api/leaderboard?mode=per_team::Bravo&sort_metric=sold_leads')
          d=r.get_json()
          assert d['mode']=='per_team' and d['selected_team']=='Bravo'
          assert d['sort_metric']=='sold_leads'
          r=client.get('/api/leaderboard?mode=whole_office&sort_metric=rank')
          assert r.get_json()['sort_metric']=='net_split'
          after=get_settings()
          assert after['active_mode']==before['active_mode']=='whole_office'
          assert after['team_vs_team_selected']==before['team_vs_team_selected']==['Alpha','Bravo']
          assert after['sort_metric']==before['sort_metric']
          print('v70 read-only API contract passed')
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start real app
        env:
          HOME: ${{ runner.temp }}/pi-home
        run: |
          python app/server.py >/tmp/pi-v70.log 2>&1 &
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8765/health && exit 0
            sleep .5
          done
          cat /tmp/pi-v70.log
          exit 1
      - name: Real-app keyboard verification
        run: node .github/scripts/test_v70.js
      - name: Final source boundary
        run: |
          git diff --name-only | sort
          bad=$(git diff --name-only | grep -E '^(app/database.py|app/sources/)' || true)
          test -z "$bad"
      - name: Commit generated v70 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app/server.py app/templates/display_v35_base.html app/templates/display.html app/static/keyboard-controls-v70.js
          if git diff --cached --quiet; then
            echo source-already-generated
            exit 0
          fi
          git commit -m 'v70: add temporary physical keyboard controls [generated]'
          git push origin HEAD:build/v70-keyboard-controls
