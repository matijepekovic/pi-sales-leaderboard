name: Salesforce report printing
on:
  pull_request:
    paths:
      - 'printer_app/report_printing_*.py'
      - 'printer_app/tests/test_report_printing.py'
      - '.github/workflows/report-printing.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest printer_app.tests.test_report_printing -v
