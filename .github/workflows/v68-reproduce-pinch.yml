name: v68 reproduce pinch
on:
  push:
    branches: [build/v68-pinch-cap]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install app and browser
        run: |
          pip install -r requirements.txt
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start real app
        env:
          HOME: ${{ runner.temp }}/pi-home
        run: |
          mkdir -p "$HOME"
          python app/server.py > /tmp/pi-app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8765/health && exit 0
            sleep .5
          done
          cat /tmp/pi-app.log
          exit 1
      - name: Reproduce touch/pointer crash path
        run: |
          cat > /tmp/repro.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/settings',{waitUntil:'networkidle'});
            await page.evaluate(()=>window.openTeamDesign(1));
            await page.locator('#tdConfirmOk').click();
            await page.locator('#tdStage').waitFor({state:'visible'});

            // A stale/synthetic touch pointer id is enough to hit the current
            // unguarded setPointerCapture call. Mobile browsers can produce the
            // same condition when a pointer is released while a pinch changes.
            await page.locator('#tdStage').dispatchEvent('pointerdown',{
              pointerId:77,pointerType:'touch',isPrimary:true,
              clientX:140,clientY:260,buttons:1
            });
            await page.waitForTimeout(100);

            console.log('page errors:', errors);
            if(!errors.some(e=>/pointer|capture|NotFound/i.test(e))){
              throw new Error('Did not reproduce the v67 pointer-capture failure');
            }
            console.log('REPRODUCED: v67 preview gesture handler throws on touch pointer capture');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          node /tmp/repro.js
