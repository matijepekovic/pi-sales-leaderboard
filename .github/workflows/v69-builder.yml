name: v69 build and verify
permissions:
  contents: write
on:
  push:
    branches: [build/v69-theme-layouts]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v69 source changes
        run: python .github/scripts/apply_v69.py
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Static and server contract checks
        run: |
          node --check app/static/theme-studio.js
          node --check app/static/themed-team-layout.js
          node --check app/static/comparison-team-cards-v53.js
          node --check app/static/broadcast-views-v55.js
          node --check app/static/theme-corner-runtime-v60.js
          node --check app/static/theme-extras-v69.js
          python -m py_compile app/themes.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'app')
          import themes
          colors={'primary':'#abcdef'}
          assert themes._clean_hero_scale(150)==150
          assert themes._clean_hero_scale(999)==200
          assert themes._clean_row_stripe({'color':'#123456','strength':35},colors)=={'color':'#123456','strength':35.0}
          assert themes._clean_row_stripe(None,colors)=={'color':'#abcdef','strength':0.0}
          m=themes._manifest()
          assert m['theme_controls']['hero_scale']['max']==200
          assert m['theme_controls']['row_stripe_strength']['max']==100
          PY
          test "$(cat VERSION)" = 69
          grep -q 'comparison-team-cards-v53.js?v=69' app/templates/display.html
          grep -q 'theme-extras-v69.js?v=69' app/templates/display.html
          grep -q 'theme-corner-runtime-v60.js?v=69' app/templates/display.html
          ! grep -q 'whole-office-scale-v56.js' app/templates/display.html
          grep -q 'const comparisonModes=new Set();' app/static/broadcast-views-v55.js
          grep -q 'theme-studio.js?v=69' app/templates/settings.html
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Prepare isolated Pi data
        env:
          HOME: ${{ runner.temp }}/pi-home
        run: |
          mkdir -p "$HOME"
          python - <<'PY'
          import sys
          sys.path.insert(0,'app')
          from database import init_db, create_team
          init_db()
          create_team('CI Theme Team')
          PY
      - name: Start real app
        env:
          HOME: ${{ runner.temp }}/pi-home
        run: |
          python app/server.py >/tmp/pi-v69.log 2>&1 &
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8765/health && exit 0
            sleep .5
          done
          cat /tmp/pi-v69.log
          exit 1
      - name: Real-app 1920x1080 verification
        run: node .github/scripts/test_v69.js
      - name: Final change boundary before generated commit
        run: |
          git diff --name-only | sort
          bad=$(git diff --name-only | grep -E '^(app/database.py|app/sources/|app/server.py)$' || true)
          test -z "$bad"
      - name: Commit generated v69 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app/themes.py app/static/theme-studio.js app/static/themed-team-layout.js app/static/broadcast-views-v55.js app/static/theme-corner-runtime-v60.js app/templates/display.html app/templates/settings.html
          if git diff --cached --quiet; then
            echo source-already-generated
            exit 0
          fi
          git commit -m 'v69: themed striping hero scale unified sizing and stacked comparisons [generated]'
          git push origin HEAD:build/v69-theme-layouts
