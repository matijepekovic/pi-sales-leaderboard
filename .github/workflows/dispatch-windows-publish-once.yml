name: Publish Stats Windows release once

on:
  push:
    branches:
      - production
    paths:
      - ".github/workflows/dispatch-windows-publish-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-installer.yml \
            --repo "${{ github.repository }}" \
            --ref production \
            -f publish=true
