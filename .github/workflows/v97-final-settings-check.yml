name: v97 final settings check
permissions:
  contents: write
on:
  push:
    branches: [build/v97-source-ux]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final wording and inline JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/static/data-source-v90.js')
          s=p.read_text().replace('The PAT secret remains write-only in Tableau Data Source.',
                                  'The PAT secret remains write-only in Tableau Login.',1)
          p.write_text(s)

          html=Path('app/templates/settings_v34_base.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,re.S)
          if not scripts: raise SystemExit('no inline settings script found')
          Path('/tmp/settings-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/settings-inline.js
          node --check app/static/data-source-v90.js
      - name: Removed legacy controls have no live references
        run: |
          for id in dateModeMonth dateModeCustom dateStart dateEnd effectiveDates testTableau pullNow useCurrentMonth; do
            ! grep -q "$id" app/templates/settings_v34_base.html || { echo "leftover legacy id: $id"; exit 1; }
          done
          ! grep -q 'FIXED_SOURCE' app/templates/settings_v34_base.html
          ! grep -q 'v94Search' app/static/data-source-v90.js
          ! grep -q 'source-picker-search-v83.js' app/templates/settings.html
          grep -q 'Tableau Login' app/static/data-source-v90.js
          grep -q 'Save for Auto Refresh' app/static/data-source-v90.js
      - name: Source and scheduler remain untouched
        run: |
          changed=$(git diff origin/main --name-only | grep -v '^.github/workflows/v97-final-settings-check.yml$' | sort)
          echo "$changed"
          test "$(echo "$changed" | tr '\n' ' ')" = "VERSION app/database.py app/static/data-source-v90.js app/templates/settings.html app/templates/settings_v34_base.html "
          ! git diff origin/main --name-only | grep -Eq '^(app/sources/|app/source_picker.py|app/tableau_scheduler.py|app/templates/display.html)'
          grep -q 'source = source_picker.resolve_source(settings)' app/tableau_scheduler.py
          grep -q 'SCHEDULE_HOURS = (6, 14)' app/tableau_scheduler.py
      - name: Commit final production wording
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/data-source-v90.js
          git diff --cached --quiet || git commit -m 'v97: finish simplified Tableau remote wording'
          git push origin HEAD:build/v97-source-ux
