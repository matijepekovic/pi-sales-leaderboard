name: Phase 4 parity verification once

on:
  push:
    branches:
      - verification/phase4-20260829
    paths:
      - ".github/workflows/phase4-verification-once.yml"

permissions:
  contents: read

jobs:
  verify-phase4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4
        with:
          path: verifier

      - name: Checkout preserved pre-refactor production
        uses: actions/checkout@v4
        with:
          ref: 004c03ede7325518ce11f3fe619a49b5ae078bf4
          path: baseline

      - name: Checkout refactored production
        uses: actions/checkout@v4
        with:
          ref: bc05c0e7cfb4b22ed23f4a77a8419b2b250c1a9a
          path: refactored

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r refactored/requirements.txt
          python -m pip install requests pillow playwright
          python -m playwright install --with-deps chromium

      - name: Run the one-time parity gate
        id: parity
        continue-on-error: true
        run: |
          python verifier/verification/phase4_parity.py \
            --baseline baseline \
            --refactored refactored \
            --report phase4-verification.json

      - name: Recheck main ref
        id: mainref
        if: always()
        shell: bash
        run: |
          expected="65826125d52d1c249a8072bb78d15108a4c8f9bc"
          actual="$(git -C verifier ls-remote origin refs/heads/main | awk '{print $1}')"
          printf '%s\n' "$actual" > main-ref.txt
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-verification-evidence
          path: |
            phase4-verification.json
            main-ref.txt
          if-no-files-found: warn

      - name: Enforce parity result
        if: always()
        shell: bash
        run: |
          test "${{ steps.parity.outcome }}" = "success"
          test "${{ steps.mainref.outcome }}" = "success"
