name: v55 Broadcast Views
on:
  push:
    branches: [build/v55-broadcast-views]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate presentation layer
        run: |
          node --check app/static/broadcast-views-v55.js
          grep -q 'data?.mode==="whole_office"' app/static/broadcast-views-v55.js
          grep -q 'assets.hero||mainLogo' app/static/broadcast-views-v55.js
          grep -q 'assets.champion||assets.row' app/static/broadcast-views-v55.js
          grep -q 'rowLimit=count<=2?4:count===3?3:2' app/static/broadcast-views-v55.js
          grep -q 'totalLimit=count<=2?6:count===3?5:4' app/static/broadcast-views-v55.js
          grep -q 'if(count===4) return {cols:2,rows:2};' app/static/broadcast-views-v55.js
          grep -q 'broadcast-views-v55.js?v=55' app/templates/display.html
          test "$(tr -d '\n' < VERSION)" = "55"
      - name: Ensure display-only diff
        run: |
          files="$(git diff --name-only origin/main...HEAD)"
          echo "$files"
          bad="$(printf '%s\n' "$files" | grep -Ev '^(VERSION|app/templates/display.html|app/static/broadcast-views-v55.js|\.github/workflows/v55-broadcast-views.yml)$' || true)"
          test -z "$bad"
