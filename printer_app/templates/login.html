{% extends 'base.html' %}{% block content %}
<section class="login"><p class="eyebrow">PRINTER APP</p><h1>Sign in</h1><p>Use the printer app's own credentials, not your Stats PIN.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">
<label>Username<input name="username" autocomplete="username" required autofocus maxlength="128"></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
<button class="primary">Sign in</button></form></section>{% endblock %}
