<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Printer Admin Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="login">
<section>
<p class="eyebrow">PRINTER ADMIN</p><h1>{{ 'Choose your password' if forced else 'Change password' }}</h1>
{% if forced %}<p class="notice">The temporary password cannot be kept. Choose your own password before opening Print Control.</p>{% endif %}
{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('admin_change_password') }}" autocomplete="off">
<input type="hidden" name="csrf" value="{{ session.csrf }}">
<input type="hidden" name="next" value="{{ next_url }}">
<label>Current password<input type="password" name="current_password" maxlength="256" autocomplete="current-password" required autofocus></label>
<label>New password<input type="password" name="new_password" minlength="10" maxlength="256" autocomplete="new-password" required></label>
<label>Confirm new password<input type="password" name="confirmation" minlength="10" maxlength="256" autocomplete="new-password" required></label>
<button class="primary" type="submit">Save new password</button>
</form>
{% if not forced %}<p><a class="button" href="{{ url_for('control') }}">Cancel</a></p>{% endif %}
</section>
</main></body></html>
