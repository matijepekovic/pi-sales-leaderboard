<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Print Control{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a href="{{ url_for('control') }}">PRINT CONTROL</a><span>Independent printer automation</span><nav><a href="{{ url_for('control') }}">Jobs</a><a href="{{ url_for('gallery.queue_page') }}">Gallery Queue</a><a href="{{ url_for('settings_page') }}">Settings</a><a href="{{ url_for('admin_change_password') }}">Password</a><form method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button type="submit">Sign out</button></form></nav></header>
<main>{% block content %}{% endblock %}</main>
<footer>Automatic printing. Administrative pages require the printer admin password.</footer></body></html>
